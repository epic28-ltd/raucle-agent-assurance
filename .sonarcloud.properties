# Read by SonarQube Cloud *Automatic Analysis* (the GitHub-App scan).
# NOTE: Automatic Analysis reads THIS file, not sonar-project.properties
# (which only applies to CI-based analysis). Only the keys below are supported.
#
# Scope to the shipped product code. Out of scope: the demo data, the fixture
# corpora and the seeded synthetic secrets (they exist to exercise detectors,
# so any "finding" there is the test doing its job), the pinned-worktree
# scratch, and run logs.
sonar.sources=packages,services,integrations,ops/assurance,ops/audit-pack,tools/verifier
sonar.tests=tests
sonar.exclusions=**/demo_data/**,**/fixtures/**,**/nohup*.out,**/.cache/**,**/__pycache__/**,**/*.zip
sonar.sourceEncoding=UTF-8
