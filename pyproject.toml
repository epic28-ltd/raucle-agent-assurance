[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# raucle is an optional dependency; its absence must surface as a SKIP reason
# (see tests/conformance/test_fixture_conformance.py), not an error.

[tool.coverage.run]
# Files excluded from coverage measurement, each with its reason (see
# docs/spikes/SONAR-ACCEPTANCE.md, "Detector-bait and cross-repo exclusions"):
#
# - tests/security fixtures and the PRIV-01 live probe are DETECTOR BAIT:
#   they exist to carry seeded secrets / contract-violating content so the
#   detectors can be proven to fire, and to fail the suite exactly when a
#   leak path opens. Their behaviour is asserted by the guard tests, not by
#   line coverage of the bait itself.
# - the conformance fixture test is the conformance bait harness.
omit = [
  "tests/security/fixtures/*",
  "tests/security/test_priv01_live.py",
  "tests/conformance/test_fixture_conformance.py",
  # The pinned raucle worktree (checked out under oaa-spike-4nov and imported
  # through the local pin) is CROSS-REPO code that belongs to raucle's own
  # coverage campaign - counting it here would double-report.
  "**/raucle-63edacd/**",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/raucle-adapter/src", "services/correlation/src", "tests", "examples"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "PLC"]
ignore = [
  "E501",  # long prose/doc lines in evidence-plane and findings-derived files
]

[tool.ruff.lint.per-file-ignores]
# reference-agent and probe examples mirror the spike scripts verbatim
"examples/reference-agent/*" = ["E402", "B007", "B015", "E731", "F811"]
"packages/raucle-adapter/examples/*" = ["E402"]