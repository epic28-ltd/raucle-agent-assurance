[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oaa-langgraph-adapter"
version = "0.1.0"
description = "LangGraph enforcement adapter for Raucle Agent Trust (Open Agent Assurance, EPIC M K3)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
raucle = []  # raucle stays a pinned-worktree dependency; see README
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/oaa_langgraph_adapter"]