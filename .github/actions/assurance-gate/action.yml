name: "Assurance gate"
description: >-
  Validate an agent assurance packet against a governance profile
  (ops/assurance-profiles: OV-4). Local-first: plain python, no paid deps.
  Exit codes: 0 PASS / 1 PARTIAL (warn, job continues) / 2 FAIL / 3 profile-data defect.
inputs:
  packet:
    description: Path to agent_assurance_packet.json
    required: true
  profile:
    description: Profile name from profiles.yaml (basic or regulated)
    required: false
    default: basic
  summary-title:
    description: Heading written to the job step summary
    required: false
    default: "Assurance gate"
  fail-on-partial:
    description: "true: PARTIAL also fails the job (strict gate); default warn-and-continue"
    required: false
    default: "false"
outputs:
  verdict:
    description: PASS, PARTIAL, FAIL or DEFECT
    value: ${{ steps.gate.outputs.verdict }}
runs:
  using: "composite"
  steps:
    - name: Ensure pyyaml (validator profile loader)
      shell: bash
      # Supply-chain pin (OV-16 review): version-pinned with --require-hashes
      # instead of an unpinned `pip install pyyaml`. Hashes are the PyPI
      # 6.0.3 sdist plus the cp310-cp314 manylinux_2_28_x86_64 wheels
      # (records at pypi.org/pypi/pyyaml/6.0.3/json), so any ubuntu-latest
      # CPython resolves to a hash-verified artifact.
      run: |
        cat > "$RUNNER_TEMP/pyyaml-requirements.txt" <<'PYEOF'
        pyyaml==6.0.3 --hash=sha256:214ed4befebe12df36bcc8bc2b64b396ca31be9304b8f59e25c11cf94a4c033b --hash=sha256:9c7708761fccb9397fe64bbc0395abcae8c4bf7b0eac081e12b809bf47700d0b --hash=sha256:b8bb0864c5a28024fac8a632c443c87c5aa6f215c0b126c449ae1a150412f31d --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6 --hash=sha256:c458b6d084f9b935061bc36216e8a69a7e293a2f1e68bf956dcd9e6cbcd143f5 --hash=sha256:d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f
        PYEOF
        python3 -m pip install --quiet --require-hashes -r "$RUNNER_TEMP/pyyaml-requirements.txt"

    - id: gate
      shell: bash
      run: |
        set -o pipefail
        validator="${{ github.workspace }}/ops/assurance-profiles/validator.py"
        output="$(python3 "$validator" --packet "${{ inputs.packet }}" --profile "${{ inputs.profile }}")" && exit_code=0 || exit_code=$?
        verdict=$(printf '%s' "$output" | python3 -c 'import json,sys; print(json.load(sys.stdin)["verdict"])')
        if [ "$exit_code" = "3" ]; then verdict=DEFECT; fi
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        {
          echo "## ${{ inputs.summary-title }}"
          echo ""
          echo "verdict: **$verdict** (exit $exit_code) - packet $(basename "${{ inputs.packet }}") vs profile ${{ inputs.profile }}"
        } >> "$GITHUB_STEP_SUMMARY"
        printf '%s\n' "$output"
        # PARTIAL is a warning unless the caller asked for a strict gate;
        # FAIL (2) and DEFECT (3) always fail the job.
        if [ "${{ inputs.fail-on-partial }}" = "true" ]; then
          [ "$exit_code" = "0" ]
        else
          [ "$exit_code" -le 1 ]
        fi
