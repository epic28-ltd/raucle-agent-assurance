name: shipped-dependency-scan

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: shipped-dependency-scan-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

# Scope (issue #96): the two shipped source services (console,
# investigation-ui) carry authoritative uv.lock files. Evidence here is
# generated from those EXACT locked sets (uv export --locked), never from
# a freshly resolved environment: a CycloneDX SBOM of the exported
# requirement set (pinned Syft) plus a live pip-audit report, each bound
# to the lockfile digest and the source commit.
#
# Classification of the audit step below: EVIDENCE-ONLY, not a gate. At
# scan time it surfaces real advisories (see
# docs/security/evidence-archive.md); wiring it as a blocking gate needs
# an owner decision (upgrade the pinned set or an exact-scope approved
# exception) and stays pending. The strict live CI gate for the test
# environment is unchanged in software-supply-chain.yml.

jobs:
  shipped-dependency-evidence:
    name: Shipped lockfile evidence for ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: console
            project: services/console
          - id: investigation-ui
            project: services/investigation-ui
    steps:
      - name: Check out release tag or pull request commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned audit and lock toolchain
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1" "uv==0.13.10"

      - name: Verify authoritative lockfile and record its digest
        env:
          PROJECT: ${{ matrix.project }}
          ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          test -s "$PROJECT/uv.lock"
          mkdir -p "evidence/$ID"
          sha256sum "$PROJECT/uv.lock" > "evidence/$ID/$ID-uv.lock.sha256"

      - name: Export the exact locked shipped dependency set
        env:
          PROJECT: ${{ matrix.project }}
          ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          uv export --project "$PROJECT" --locked --no-dev --all-extras --no-emit-project \
            --format requirements.txt -o "evidence/$ID/shipped-requirements.txt"
          test -s "evidence/$ID/shipped-requirements.txt"
          sha256sum "evidence/$ID/shipped-requirements.txt" > "evidence/$ID/shipped-requirements.txt.sha256"
          count="$(grep -cE '^[A-Za-z0-9_.-]+==' "evidence/$ID/shipped-requirements.txt")"
          test "$count" -gt 0
          printf 'locked_requirements=%s\n' "$count" > "evidence/$ID/locked-set-count.txt"

      - name: Generate CycloneDX SBOM from the exact exported lock set
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          file: evidence/${{ matrix.id }}/shipped-requirements.txt
          format: cyclonedx-json
          syft-version: v1.57.2
          output-file: evidence/${{ matrix.id }}/${{ matrix.id }}-shipped.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Audit the exact exported lock set against live advisories (evidence-only)
        env:
          ID: ${{ matrix.id }}
        run: |
          # CLASSIFICATION: evidence-only. pip-audit findings on the exact
          # locked shipped set are RETAINED as evidence; they do not fail
          # this job because making them a gate requires an owner decision
          # (pinned-set upgrade or an exact-scope approved exception),
          # PENDING for issue #96. Synthetic fixtures never feed this run.
          # A tool failure (no report produced) still fails through the
          # test -s check below.
          set -uo pipefail
          pip-audit -r "evidence/$ID/shipped-requirements.txt" --strict --progress-spinner off \
            --format json --output "evidence/$ID/$ID-shipped-audit.json" \
            || echo "::warning::pip-audit reported advisories on the shipped locked set; evidence retained, blocking gate wiring pending (issue #96)"
          test -s "evidence/$ID/$ID-shipped-audit.json"

      - name: Verify the audit report covers exactly the locked set
        env:
          ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          python3 -c "
          import json, pathlib, sys, os
          base = pathlib.Path('evidence') / os.environ['ID']
          report = json.loads((base / (os.environ['ID'] + '-shipped-audit.json')).read_text())
          counted = int((base / 'locked-set-count.txt').read_text().split('=')[1])
          rows = report['dependencies']
          assert len(rows) == counted, (
              'audit covers %d of %d locked requirements' % (len(rows), counted))
          print('audit report covers %d locked requirements' % len(rows))
          "

      - name: Bind evidence to lockfile, commit and pinned tooling
        env:
          PROJECT: ${{ matrix.project }}
          ID: ${{ matrix.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name || 'pull-request' }}
        run: |
          set -euo pipefail
          {
            printf 'service=%s\n' "$PROJECT"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'source_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'lockfile=%s\n' "$PROJECT/uv.lock"
            printf 'uv_version=0.13.10\n'
            printf 'pip_audit_version=2.10.1\n'
            printf 'syft_version=v1.57.2\n'
            printf 'audit_disposition=evidence-only-blocking-gate-pending-owner-decision-issue-96\n'
            printf 'inventory_scope=exact-exported-uv-lock-set-requirements\n'
          } > "evidence/$ID/$ID-shipped-set-provenance.txt"
          {
            sha256sum "$PROJECT/uv.lock"
            sha256sum "evidence/$ID/shipped-requirements.txt"
            sha256sum "evidence/$ID/$ID-shipped.cdx.json"
            sha256sum "evidence/$ID/$ID-shipped-audit.json"
          } > "evidence/$ID/$ID-shipped-set-sha256.txt"

      - name: Upload shipped dependency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shipped-dependency-evidence-${{ matrix.id }}
          path: evidence/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 30
