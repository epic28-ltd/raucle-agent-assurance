name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          # test-suite dependencies (raucle-free set): these are imported
          # directly by root tests/ modules (cryptography, yaml, fastapi
          # TestClient, otel workflow test) and were previously missing,
          # which kept main red on the pytest step.
          pip install cryptography pyyaml fastapi httpx opentelemetry-sdk
          pip install opentelemetry-exporter-otlp-proto-http
          pip install jsonschema
          # jsonschema: schema-validation tooling for the conformance and
          # expectations tests (OV-7/-8).
      - name: ruff format check
        run: ruff format --check .
      - name: ruff check
        run: ruff check .
      # Licence hygiene before any test run: every .py in the mapped tree
      # carries Apache-2.0 (mapping governed by LICENSING.md).
      - name: licence header check
        run: python3 scripts/check_licence_headers.py
      - name: pytest (raucle-free set; raucle-dependent tests skip with reason)
        run: pytest tests/ -rs
        env:
          PYTHONPATH: packages/raucle-adapter/src

      # EVAL-01: synthetic regression corpus — reproducible offline replay
      # (100 cases, versioned, seeded generator; results written and diffed
      # against nothing external: fully deterministic).
      - name: synthetic regression corpus (EVAL-01)
        run: |
          python tests/eval/run_corpus.py --write-results tests/eval/results.json
          git diff --exit-code -- tests/eval/corpus/corpus.json || {
            echo "::error::corpus.json not byte-identical to the generator output"
            python tests/eval/generate_corpus.py
            git diff | cat
            exit 1
          }
        env:
          PYTHONPATH: packages/raucle-adapter/src

# NOTE: this workflow file exists locally only during the LOCAL-ONLY phase —
# the repository deliberately has no remote and nothing is pushed/enabled.
# See docs/spikes/ and REPO-INIT findings for the pending hosting decision.

  otlp-collector-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install instrumentation test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml cryptography opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
      - name: Start pinned local OpenTelemetry Collector
        run: |
          docker run -d --name oaa-otel-collector \
            -p 4318:4318 -p 13133:13133 \
            -v "$PWD/tests/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.120.0 \
            --config=/etc/otelcol-contrib/config.yaml
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:13133/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs oaa-otel-collector
          exit 1
      - name: Export real OTLP spans
        env:
          OAA_OTLP_ENDPOINT: http://127.0.0.1:4318/v1/traces
          PYTHONPATH: packages/instrumentation/src
        run: pytest -q -s tests/otel/test_otel_collector_integration.py | tee otel-integration.log
      - name: Assert collector received parented, redacted spans
        if: always()
        run: |
          docker logs oaa-otel-collector > collector.log 2>&1
          TRACE_ID=$(sed -n 's/^EXPECTED_TRACE_ID=//p' otel-integration.log | tail -1)
          PARENT_ID=$(sed -n 's/^EXPECTED_PARENT_ID=//p' otel-integration.log | tail -1)
          test -n "$TRACE_ID"
          test -n "$PARENT_ID"
          grep -F "oaa.gate.decision" collector.log
          grep -F "$TRACE_ID" collector.log
          grep -F "$PARENT_ID" collector.log
          grep -F "[REDACTED:bearer_token" collector.log
          grep -F "[REDACTED:aws_access_key" collector.log
          ! grep -F "integration-secret-token-value-123456" collector.log
          ! grep -F "AKIAIOSFODNN7EXAMPLE" collector.log
      - name: Stop collector
        if: always()
        run: docker rm -f oaa-otel-collector || true

  audit-pack-resolver-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Raucle OSS resolver source
        uses: actions/checkout@v4
        with:
          repository: epic28-ltd/raucle
          ref: e16d6cd130ce22d118a5388a960c350ca5d31a84
          path: .raucle-oss
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit-pack test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi httpx cryptography==48.0.0 pyyaml==6.0.2 cffi==2.1.1 pycparser==3.12
          pip install --no-deps "./.raucle-oss"
      - name: Exercise the real pinned chain-graph resolver
        env:
          RAUCLE_OSS_HOME: ${{ github.workspace }}/.raucle-oss
          PYTHONPATH: packages/raucle-adapter/src
        run: |
          pytest -q -rs \
            tests/audit-pack/test_audit_pack.py \
            tests/audit-pack/test_replay_pack.py
