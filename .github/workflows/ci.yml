name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          # test-suite dependencies (raucle-free set): these are imported
          # directly by root tests/ modules (cryptography, yaml, fastapi
          # TestClient, otel workflow test) and were previously missing,
          # which kept main red on the pytest step.
          pip install cryptography pyyaml fastapi httpx opentelemetry-sdk
          pip install opentelemetry-exporter-otlp-proto-http
          pip install jsonschema
          # jsonschema: schema-validation tooling for the conformance and
          # expectations tests (OV-7/-8).
      - name: ruff format check
        run: ruff format --check .
      - name: ruff check
        run: ruff check .
      - name: pytest (raucle-free set; raucle-dependent tests skip with reason)
        run: pytest tests/ -rs
        env:
          PYTHONPATH: packages/raucle-adapter/src

      # EVAL-01: synthetic regression corpus — reproducible offline replay
      # (100 cases, versioned, seeded generator; results written and diffed
      # against nothing external: fully deterministic).
      - name: synthetic regression corpus (EVAL-01)
        run: |
          python tests/eval/run_corpus.py --write-results tests/eval/results.json
          git diff --exit-code -- tests/eval/corpus/corpus.json || {
            echo "::error::corpus.json not byte-identical to the generator output"
            python tests/eval/generate_corpus.py
            git diff | cat
            exit 1
          }
        env:
          PYTHONPATH: packages/raucle-adapter/src

# NOTE: this workflow file exists locally only during the LOCAL-ONLY phase —
# the repository deliberately has no remote and nothing is pushed/enabled.
# See docs/spikes/ and REPO-INIT findings for the pending hosting decision.