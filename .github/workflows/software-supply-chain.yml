name: software-supply-chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate repository SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          path: .
          format: cyclonedx-json
          syft-version: v1.57.2
          artifact-name: raucle-agent-assurance-cyclonedx
          output-file: ./sbom.cdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Validate SBOM exists and is non-empty
        run: test -s sbom.cdx.json

  dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install CI runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest cryptography pyyaml fastapi httpx opentelemetry-sdk
          pip install opentelemetry-exporter-otlp-proto-http jsonschema pip-audit
      - name: Exercise synthetic vulnerability policy fixtures
        run: pytest -q tests/security/test_vulnerability_policy.py
      - name: Audit installed Python environment
        run: pip-audit --local --strict --progress-spinner off
