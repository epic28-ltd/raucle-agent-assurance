name: python-distribution-sbom

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: python-distribution-sbom-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  build-python-distributions:
    name: Build and inventory ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: raucle-adapter
            project: packages/raucle-adapter
          - id: instrumentation
            project: packages/instrumentation
          - id: ep-aec
            project: packages/ep-aec
          - id: audit-sources
            project: integrations/audit-sources
          - id: langgraph-adapter
            project: integrations/langgraph-adapter
          - id: correlation
            project: services/correlation
    steps:
      - name: Check out release tag or pull request commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned Python build frontend and backend
        run: python -m pip install --disable-pip-version-check "build==1.2.2.post1" "hatchling==1.27.0"

      - name: Build wheel and source distribution
        env:
          PROJECT_DIR: ${{ matrix.project }}
        run: |
          mkdir -p dist evidence/${{ matrix.id }}
          python -m build --no-isolation --sdist --wheel --outdir dist "$PROJECT_DIR"
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1

      - name: Identify exact distribution files
        id: distributions
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$wheel"
          test -n "$sdist"
          printf 'wheel=%s\n' "$wheel" >> "$GITHUB_OUTPUT"
          printf 'sdist=%s\n' "$sdist" >> "$GITHUB_OUTPUT"

      - name: Generate wheel CycloneDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          file: ${{ steps.distributions.outputs.wheel }}
          format: cyclonedx-json
          syft-version: v1.57.2
          output-file: ./evidence/${{ matrix.id }}/${{ matrix.id }}-wheel.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate sdist CycloneDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          file: ${{ steps.distributions.outputs.sdist }}
          format: cyclonedx-json
          syft-version: v1.57.2
          output-file: ./evidence/${{ matrix.id }}/${{ matrix.id }}-sdist.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Repeat wheel SBOM scan
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          file: ${{ steps.distributions.outputs.wheel }}
          format: cyclonedx-json
          syft-version: v1.57.2
          output-file: ./wheel-repeat.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Repeat sdist SBOM scan
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          file: ${{ steps.distributions.outputs.sdist }}
          format: cyclonedx-json
          syft-version: v1.57.2
          output-file: ./sdist-repeat.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Compare normalized SBOM component inventories
        run: |
          set -euo pipefail
          normalize() {
            jq -S '
              {
                components: (
                  (.components // [])
                  | map({
                      type: (.type // ""),
                      name: (.name // ""),
                      version: (.version // ""),
                      purl: (.purl // ""),
                      scope: (.scope // ""),
                      licenses: (.licenses // [])
                    })
                  | sort_by(.purl, .name, .version, .type)
                )
              }
            ' "$1"
          }
          normalize "evidence/${{ matrix.id }}/${{ matrix.id }}-wheel.cdx.json" > wheel-first.normalized.json
          normalize wheel-repeat.cdx.json > wheel-repeat.normalized.json
          normalize "evidence/${{ matrix.id }}/${{ matrix.id }}-sdist.cdx.json" > sdist-first.normalized.json
          normalize sdist-repeat.cdx.json > sdist-repeat.normalized.json
          diff -u wheel-first.normalized.json wheel-repeat.normalized.json
          diff -u sdist-first.normalized.json sdist-repeat.normalized.json

      - name: Bind SBOMs and distributions to exact SHA-256 digests
        env:
          PROJECT: ${{ matrix.project }}
          RELEASE_TAG: ${{ github.event.release.tag_name || 'pull-request' }}
          WHEEL: ${{ steps.distributions.outputs.wheel }}
          SDIST: ${{ steps.distributions.outputs.sdist }}
        run: |
          wheel_sbom="evidence/${{ matrix.id }}/${{ matrix.id }}-wheel.cdx.json"
          sdist_sbom="evidence/${{ matrix.id }}/${{ matrix.id }}-sdist.cdx.json"
          test -s "$wheel_sbom"
          test -s "$sdist_sbom"
          (
            sha256sum "$WHEEL" "$wheel_sbom"
            sha256sum "$SDIST" "$sdist_sbom"
          ) > "evidence/${{ matrix.id }}/${{ matrix.id }}-artifact-sbom-sha256.txt"
          {
            printf 'project=%s\n' "$PROJECT"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'wheel_file=%s\n' "$(basename "$WHEEL")"
            printf 'wheel_sbom=%s\n' "$(basename "$wheel_sbom")"
            printf 'sdist_file=%s\n' "$(basename "$SDIST")"
            printf 'sdist_sbom=%s\n' "$(basename "$sdist_sbom")"
            printf 'inventory_scope=separate-file-scan-for-each-built-distribution\n'
          } > "evidence/${{ matrix.id }}/${{ matrix.id }}-build-provenance.txt"

      - name: Upload candidate distribution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist-evidence-${{ matrix.id }}
          path: evidence/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 30


  inventory-source-services:
    name: Inventory source service ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: console
            project: services/console
          - id: investigation-ui
            project: services/investigation-ui
    steps:
      - name: Check out release tag or pull request commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Verify authoritative service manifests
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          test -s "$PROJECT/pyproject.toml"
          test -s "$PROJECT/uv.lock"
          mkdir -p "evidence/${{ matrix.id }}"

      - name: Generate CycloneDX SBOM from exact service lockfile environment
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          path: ${{ matrix.project }}
          format: cyclonedx-json
          syft-version: v1.57.2
          output-file: evidence/${{ matrix.id }}/${{ matrix.id }}-service.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Bind service SBOM to exact manifest, lockfile and source commit
        env:
          PROJECT: ${{ matrix.project }}
          RELEASE_TAG: ${{ github.event.release.tag_name || 'pull-request' }}
        run: |
          set -euo pipefail
          SBOM="evidence/${{ matrix.id }}/${{ matrix.id }}-service.cdx.json"
          test -s "$SBOM"
          {
            sha256sum "$PROJECT/pyproject.toml"
            sha256sum "$PROJECT/uv.lock"
            sha256sum "$SBOM"
          } > "evidence/${{ matrix.id }}/${{ matrix.id }}-service-sbom-sha256.txt"
          {
            printf 'service=%s\n' "$PROJECT"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'source_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'manifest=%s\n' "$PROJECT/pyproject.toml"
            printf 'lockfile=%s\n' "$PROJECT/uv.lock"
            printf 'inventory_scope=source-service-directory-and-uv-lockfile\n'
          } > "evidence/${{ matrix.id }}/${{ matrix.id }}-service-provenance.txt"

      - name: Upload source-service SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-service-evidence-${{ matrix.id }}
          path: evidence/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 30

  publish-release-evidence:
    name: Attach Python distribution SBOM evidence to release
    if: github.event_name == 'release'
    needs: [build-python-distributions, inventory-source-services]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all distribution evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-*-evidence-*
          path: evidence
          merge-multiple: true

      - name: Attach distribution SBOM evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sbom_count="$(find evidence -type f -name '*.cdx.json' | wc -l)"
          test "$sbom_count" -eq 14
          gh release upload "$RELEASE_TAG" evidence/* --clobber
