name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonar:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # Mirrors ci.yml's dependency install (root pyproject is not an
      # installable package; raucle is an optional runtime dep).
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov cryptography pyyaml fastapi httpx \
            opentelemetry-sdk opentelemetry-exporter-otlp-proto-http \
            raucle>=0.23.5 \
            jsonschema
          # raucle is required here (optional at runtime): the analysed suite
          # must exercise the REAL receipt verifier, not its fallback state
      # All suites: repo-root tests/ plus each package's own suite. The
      # per-package suites were previously uncollected anywhere, so their
      # new-code lines showed zero coverage in Sonar.
      - name: Run tests with coverage
        run: >-
          pytest tests/ packages/ep-aec/tests services/console/tests
          services/investigation-ui/tests integrations/audit-sources/tests
          integrations/langgraph-adapter/tests
          --cov --cov-report=xml:coverage.xml --tb=short -q
        env:
          PYTHONPATH: packages/raucle-adapter/src
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=epic28-ltd
            -Dsonar.projectKey=epic28-ltd_raucle-agent-assurance
            -Dsonar.python.coverage.reportPaths=coverage.xml
