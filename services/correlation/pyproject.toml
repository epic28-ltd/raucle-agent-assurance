# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oaa-correlation"
version = "0.0.1.dev0"
description = "Open Agent Assurance — minimal COR-01 correlation engine (ADR-0002 states, offline-testable)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Open Agent Assurance contributors" }]
dependencies = []  # stdlib only; the Langfuse smoke is optional and separate

[tool.hatch.build.targets.wheel]
packages = ["src/oaa_correlation"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "integrations"]