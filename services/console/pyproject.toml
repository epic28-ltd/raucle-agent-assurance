[build-system]
requires = []
build-backend = "skip"

[project]
name = "raucle-console"
version = "0.1.0"
description = "Raucle Console - EPIC-N single-page application shell for the Raucle agent suite (FastAPI, no build toolchain)."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.120.1",  # floor raised so starlette can move past 0.48.0
  "starlette==0.49.1",  # security fix: CVE-2025-62727 (GHSA-7f5h-v6xp-fcq8); fastapi 0.118.3 capped starlette <0.49.0
  "httpx==0.28.1",  # fastapi TestClient transport
]
[project.optional-dependencies]
serve = ["uvicorn==0.38.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "PLC"]

[pytest.ini_options]
testpaths = ["tests"]