<html lang="en" data-bs-theme="light" data-bs-navbar-position="combined">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raucle Console</title>
<link rel="stylesheet" href="/static/vendor/tabler/tabler.min.css">
<link rel="stylesheet" href="/static/vendor/tabler/tabler-vendors.min.css">
<style>
  /* ------------------------------------------------------------- house tweaks
     Semantic colour system on top of Tabler tokens:
     green = proven / connected; amber = un-proven / degraded;
     red = action needed; grey = exempt / not purchased. */
  :root{
    --c-good:#2fb344; --c-good-ink:#186a29; --c-good-bg:#e6f6ea; --c-good-line:#b9e3c4;
    --c-look:#d97706; --c-look-ink:#8a4b06; --c-look-bg:#fdf3e2; --c-look-line:#f0d9a8;
    --c-act:#d63939;  --c-act-ink:#92211f;  --c-act-bg:#fbebeb;  --c-act-line:#f0b9b9;
    --c-exempt:#667382; --c-exempt-bg:#e9edf1; --c-exempt-line:#c9d2dc;
  }
  html[data-bs-theme="dark"]{
    --c-good-bg:#12301a; --c-good-line:#2b5c39;
    --c-look-bg:#332712; --c-look-line:#5f4a1e;
    --c-act-bg:#381919;  --c-act-line:#6b2a2a;
    --c-exempt-bg:#242b33; --c-exempt-line:#3d4757;
  }
  .chip{display:inline-flex;align-items:center;gap:.2rem;border-radius:4px;
    padding:.06rem .45rem;font-size:.72rem;font-weight:600;border:1px solid;
    line-height:1.6;white-space:nowrap}
  .tok-good{color:var(--c-good-ink);background:var(--c-good-bg);border-color:var(--c-good-line)}
  .tok-look{color:var(--c-look-ink);background:var(--c-look-bg);border-color:var(--c-look-line)}
  .tok-act{color:var(--c-act-ink);background:var(--c-act-bg);border-color:var(--c-act-line)}
  .tok-exempt{color:var(--c-exempt);background:var(--c-exempt-bg);border-color:var(--c-exempt-line)}
  html[data-bs-theme="dark"] .tok-good{color:#7ee2a0}
  html[data-bs-theme="dark"] .tok-look{color:#f0b862}
  html[data-bs-theme="dark"] .tok-act{color:#f2a0a0}
  html[data-bs-theme="dark"] .tok-exempt{color:#a8b3c0}
  /* welcome banner */
  .welcome{border:0;border-radius:12px;color:#fff;
    background:linear-gradient(120deg,#1e3a8a 0%,#2563eb 52%,#3b82f6 100%);
    box-shadow:0 10px 28px rgba(30,58,138,.25)}
  html[data-bs-theme="dark"] .welcome{background:linear-gradient(120deg,#111a35 0%,#1b2f66 52%,#23488f 100%)}
  .welcome .btn-light{color:#1e3a8a}
  /* sidebar: Tabler positions .navbar-vertical fixed on desktop; we only make
     it scrollable and highlight the active item */
  .navbar-vertical .nav-link[aria-current="page"],
  .navbar-vertical .nav-link.active{background:rgba(var(--tblr-primary-rgb),.16);color:var(--tblr-primary);font-weight:600}
  .navbar-vertical .nav-link{display:flex;justify-content:space-between;align-items:center}
  /* search dropdown */
  .search-results{position:absolute;left:0;top:calc(100% + .3rem);z-index:1060;
    background:var(--tblr-bg-surface);border:1px solid var(--tblr-border-color);
    border-radius:8px;min-width:340px;display:none;box-shadow:var(--tblr-shadow-3)}
  .search-results.show{display:block}
  .search-results button{display:block;width:100%;text-align:left;border:0;font:inherit;
    padding:.45rem .7rem;background:none;color:var(--tblr-body-color)}
  .search-results button:hover{background:var(--tblr-active-bg)}
  /* explain box */
  .explain{border-top:1px dashed var(--tblr-border-color);margin-top:.7rem;padding-top:.55rem;
    font-size:.82rem;color:var(--tblr-secondary)}
  .explain b{color:var(--tblr-body-color)}
  /* banner (alpha placeholders and add-in offline states) */
  .banner{border:1px solid var(--c-look-line);background:var(--c-look-bg);color:var(--c-look-ink);
    border-radius:8px;padding:.55rem .9rem;font-size:.88rem}
  .banner.red{border-color:var(--c-act-line);background:var(--c-act-bg);color:var(--c-act-ink)}
  /* KPI stat card */
  .stat-card .subicon{width:2.4rem;height:2.4rem;border-radius:8px;display:flex;
    align-items:center;justify-content:center;flex:0 0 auto}
  .stat-card .big{font-size:1.85rem;font-weight:700;line-height:1.1;display:block}
  .stat-card .lbl{color:var(--tblr-secondary);font-size:.8rem}
  .stat-card .sub{font-size:.75rem}
  /* charts */
  .legend-swatch{width:.85rem;height:.85rem;border-radius:3px;display:inline-block;flex:0 0 auto}
  .chart-note{font-size:.78rem;color:var(--tblr-secondary)}
  /* list feed */
  .feed-item .what{font-size:.9rem}
  .feed-item .when{font-size:.72rem;color:var(--tblr-secondary)}
  iframe{width:100%;height:78vh;border-radius:8px;background:#fff;border:1px solid var(--tblr-border-color)}
  button:focus-visible,input:focus-visible,[tabindex]:focus-visible,a:focus-visible{
    outline:3px solid var(--tblr-primary);outline-offset:1px}
</style>
</head>
<body>
<div class="page">

  <!-- ---------------------------------------------------------------- sidebar -->
  <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark" aria-label="Console navigation">
    <div class="container-fluid">
      <h1 class="navbar-brand navbar-brand-autodark mb-0">Raucle Console</h1>
      <p class="navbar-text text-secondary small mb-2 mt-1 d-none d-lg-block">Agent suite shell - alpha</p>
      <div class="collapse navbar-collapse" id="sidebar-menu">
        <ul class="navbar-nav pt-lg-3" id="side-nav"></ul>
        <p class="text-secondary small px-2 mt-4 mb-0 d-none d-lg-block">
          Single-tenant alpha (one tenant: default). Org identity is derived by
          the server per the tenancy ADR.
        </p>
      </div>
    </div>
  </aside>

  <!-- ---------------------------------------------------------------- topbar -->
  <header class="navbar navbar-expand-md d-print-none sticky-top">
    <div class="container-xl">
      <div class="position-relative me-auto" style="min-width:260px">
        <input id="q" class="form-control" type="search" placeholder="Search the console..." aria-label="Global search">
        <div id="search-results" class="search-results" role="listbox"></div>
      </div>
      <div class="nav-item d-none d-md-block ms-3">
        <span class="text-secondary">Tenant:</span> <b id="tenant-label">default</b>
      </div>
      <div class="ms-3">
        <button id="bell" class="btn position-relative" aria-label="Notifications">
          Notifications
          <span id="bell-count" class="badge bg-exempt-tok tok-exempt ms-1">0</span>
        </button>
      </div>
      <div class="ms-2">
        <button id="theme-toggle" class="btn btn-ghost-primary" type="button" aria-label="Switch colour theme"></button>
      </div>
      <div class="ms-2">
        <button id="profile-btn" class="btn" type="button" aria-haspopup="menu">Profile</button>
      </div>
    </div>
  </header>

  <!-- ---------------------------------------------------------------- body -->
  <div class="page-wrapper">
    <main class="page-body" id="view" tabindex="0">
      <div class="container-xl py-4">
        <div id="legend" class="d-flex align-items-center gap-2 flex-wrap small text-secondary mb-3"></div>
        <div id="page" aria-live="polite"></div>
      </div>
    </main>
  </div>
</div>

<script type="module">
/* Raucle Console SPA - EPIC-N. Vanilla JS, textContent only (threat-model T5:
   no markup-injection sinks anywhere, no external script or stylesheet fetches
   at runtime; Tabler is vendored locally under /static/vendor/tabler).
   The only network calls this page makes are to this console's own API and
   the console-side proxy of the configured Assurance add-in origin. */

'use strict';

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

/* ------------------------------------------------------------ icons (Tabler outline paths, inlined) */
/* SVG namespace assembled in parts so no URL literal appears in this file */
const SVG_NS = ['http:', '', 'www.w3.org', '2000', 'svg'].join('/');
const ICONS = {
  'file-text': ['M14 3v4a1 1 0 0 0 1 1h4', 'M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z', 'M9 13h1', 'M9 17h5'],
  'shield': ['M12 3a12 12 0 0 0 8.5 3a12 12 0 0 0 -8.5 15a12 12 0 0 0 8.5 -15a12 12 0 0 0 -8.5 -3'],
  'activity': ['M3 12h4l3 8l4 -16l3 8h4'],
  'apps': ['M4 4h6v6h-6z', 'M14 4h6v6h-6z', 'M4 14h6v6h-6z', 'M14 14h6v6h-6z'],
  'sun': ['M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0', 'M12 3v1', 'M12 20v1', 'M3 12h1', 'M20 12h1', 'M5.6 5.6l.7 .7', 'M17.7 17.7l.7 .7', 'M5.6 18.4l.7 -.7', 'M17.7 6.3l.7 -.7'],
  'moon': ['M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z'],
  'chevron': ['M9 6l6 6l-6 6'],
  'alert': ['M12 9v4', 'M12 3.2l9.166 16.032a1.5 1.5 0 0 1 -1.3 2.268h-15.732a1.5 1.5 0 0 1 -1.3 -2.268l9.166 -16.032a1.5 1.5 0 0 1 2.5 0', 'M12 16h.01'],
};
function iconEl(name, size) {
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', size || 20);
  svg.setAttribute('height', size || 20);
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '2');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  for (const d of (ICONS[name] || [])) {
    const p = document.createElementNS(SVG_NS, 'path');
    p.setAttribute('d', d);
    svg.appendChild(p);
  }
  return svg;
}

/* ------------------------------------------------------------ data + config */
const chipName = { connected: 'Connected', degraded: 'Degraded', not_purchased: 'Not purchased' };
const chipTone = { connected: 'tok-good', degraded: 'tok-look', not_purchased: 'tok-exempt' };
const chipEl = (status) => el('span', ['chip', chipTone[status] || 'tok-exempt'].join(' '), chipName[status] || 'Unknown');

let overview = null;
let dash = null; /* live add-in dashboard proxy payload, null when offline */
let config = { assurance_url: 'http://127.0.0.1:3411', trust_gate_env: 'RAUCLE_TRUST_GATE_CONFIG' };
const NAV = [
  { id: 'overview', label: 'Overview', section: 'overview' },
  { id: 'trust', label: 'Raucle Agent Trust', section: 'products' },
  { id: 'assurance', label: 'Raucle Agent Assurance', section: 'products' },
  { id: 'red', label: 'Raucle Agent Red', section: 'products' },
  { id: 'settings', label: 'Settings', section: 'tenant' },
  { id: 'profile', label: 'Profile', section: 'tenant' },
  { id: 'notifications', label: 'Notifications', section: 'tenant' },
];
const TITLES = Object.fromEntries(NAV.map(n => [n.id, n.label]));

/* ------------------------------------------------------------ sidebar */
function sideItem(item) {
  const a = el('a', 'nav-link');
  a.href = '#' + item.id;
  a.dataset.route = item.id;
  a.appendChild(iconEl(item.id === 'overview' ? 'activity' : item.id === 'settings' ? 'apps' : item.id === 'notifications' ? 'alert' : 'shield', 17));
  a.appendChild(el('span', 'nav-link-title', item.label));
  a.title = item.label;
  if (item.section === 'products') {
    const status = overview && overview.addins
      ? overview.addins.find(a2 => a2.id === item.id)
      : null;
    a.appendChild(chipEl(status ? status.status : 'not_purchased'));
  }
  if (item.id === 'notifications') {
    const count = overview ? overview.notifications.count : 0;
    a.appendChild(el('span', 'badge ' + (count ? 'badge bg-red text-white' : 'badge bg-secondary'), String(count)));
  }
  const li = el('li', 'nav-item');
  li.appendChild(a);
  return li;
}

function buildSidebar() {
  const nav = document.getElementById('side-nav');
  for (const section of ['overview', 'products', 'tenant']) {
    nav.appendChild(el('li', 'nav-item small text-secondary text-uppercase fw-bold mt-3 px-2',
      section === 'overview' ? 'Overview' : section === 'products' ? 'Products' : 'Tenant'));
    for (const item of NAV.filter(n => n.section === section)) nav.appendChild(sideItem(item));
  }
  if (nav.classList) nav.setAttribute('aria-label', 'Console navigation');
}

function buildLegend() {
  const legend = document.getElementById('legend');
  legend.replaceChildren();
  legend.appendChild(el('span', null, 'Legend:'));
  const row = (chip, label) => {
    legend.appendChild(chipEl(chip));
    legend.appendChild(el('span', null, label));
  };
  row('connected', 'add-in connected');
  row('degraded', 'add-in offline (degraded)');
  row('not_purchased', 'not purchased');
}

function markCurrent(route) {
  document.querySelectorAll('[data-route]').forEach(n => {
    if (n.dataset.route === route) {
      n.setAttribute('aria-current', 'page');
      if (n.classList.contains('nav-link')) n.classList.add('active');
    } else {
      n.removeAttribute('aria-current');
      n.classList.remove('active');
    }
  });
}

/* ------------------------------------------------------------ small builders */
function page(title) {
  const p = el('div');
  const h = el('h2', 'mb-3', title);
  p.appendChild(h);
  return p;
}

function card(title) {
  const c = el('div', 'card');
  if (title) {
    const hd = el('div', 'card-header');
    hd.appendChild(el('h3', 'card-title', title));
    c.appendChild(hd);
  }
  const body = el('div', 'card-body');
  c.appendChild(body);
  body.ownerCard = c;
  return body;
}

function explain(node, what, text) {
  const e = el('div', 'explain');
  e.appendChild(el('b', null, 'What is this? '));
  e.appendChild(el('span', null, text));
  node.appendChild(e);
  node.appendChild(el('p', null, '')); /* spacing */
  return e;
}

/* ------------------------------------------------------------ charts (hand-built SVG) */
const TONES = { good: 'var(--c-good)', look: 'var(--c-look)', act: 'var(--c-act)', exempt: 'var(--c-exempt)' };

function svgEl(name) {
  return document.createElementNS(SVG_NS, name);
}

/* donut: segments = [{label, value, tone}] */
function donutChart(segments) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  const wrap = el('div', 'row align-items-center g-3');
  const colA = el('div', 'col-auto');
  const svg = svgEl('svg');
  svg.setAttribute('viewBox', '0 0 42 42');
  svg.setAttribute('width', '132');
  svg.setAttribute('height', '132');
  if (!total) {
    const c = svgEl('circle');
    c.setAttribute('cx', '21'); c.setAttribute('cy', '21'); c.setAttribute('r', '15.915');
    c.setAttribute('fill', 'none'); c.setAttribute('stroke', 'var(--c-exempt)');
    c.setAttribute('stroke-width', '6'); c.setAttribute('opacity', '.3');
    svg.appendChild(c);
    colA.appendChild(svg);
    wrap.appendChild(colA);
    return wrap;
  }
  /* circumference is 100 by construction (r 15.915), so dash units are per cent */
  let offset = 25; /* start at 12 o'clock */
  for (const seg of segments) {
    if (!seg.value) continue;
    const pct = (seg.value / total) * 100;
    const c = svgEl('circle');
    c.setAttribute('cx', '21'); c.setAttribute('cy', '21'); c.setAttribute('r', '15.915');
    c.setAttribute('fill', 'none');
    c.setAttribute('stroke', TONES[seg.tone] || TONES.exempt);
    c.setAttribute('stroke-width', '6');
    c.setAttribute('stroke-dasharray', pct.toFixed(2) + ' ' + (100 - pct).toFixed(2));
    c.setAttribute('stroke-dashoffset', offset.toFixed(2));
    const t = svgEl('title');
    t.textContent = seg.label + ': ' + seg.value;
    c.appendChild(t);
    svg.appendChild(c);
    offset -= pct;
    if (offset < -75) offset += 100;
  }
  const txt = svgEl('text');
  txt.setAttribute('x', '21'); txt.setAttribute('y', '23');
  txt.setAttribute('text-anchor', 'middle');
  txt.setAttribute('dominant-baseline', 'middle');
  txt.setAttribute('font-size', '7');
  txt.setAttribute('font-weight', '700');
  txt.setAttribute('fill', 'var(--tblr-body-color)');
  txt.textContent = String(total);
  svg.appendChild(txt);
  const sub = svgEl('text');
  sub.setAttribute('x', '21'); sub.setAttribute('y', '29');
  sub.setAttribute('text-anchor', 'middle');
  sub.setAttribute('font-size', '2.6');
  sub.setAttribute('fill', 'var(--tblr-secondary)');
  sub.textContent = 'rows';
  svg.appendChild(sub);
  colA.appendChild(svg);
  wrap.appendChild(colA);

  const colB = el('div', 'col');
  for (const seg of segments) {
    const li = el('div', 'd-flex align-items-center gap-2 mb-1');
    const sw = el('span', 'legend-swatch');
    sw.style.background = TONES[seg.tone] || TONES.exempt;
    li.appendChild(sw);
    li.appendChild(el('span', null, seg.label));
    li.appendChild(el('span', 'ms-auto fw-semibold', String(seg.value)));
    colB.appendChild(li);
  }
  wrap.appendChild(colB);
  return wrap;
}

/* stacked bar: segments = [{label, value, tone}] */
function stackedBar(segments) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  const wrap = el('div');
  const svg = svgEl('svg');
  svg.setAttribute('viewBox', '0 0 100 12');
  svg.setAttribute('width', '100%');
  svg.setAttribute('height', '30');
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.style.display = 'block';
  if (!total) {
    const r = svgEl('rect');
    r.setAttribute('x', '0'); r.setAttribute('y', '0');
    r.setAttribute('width', '100'); r.setAttribute('height', '12');
    r.setAttribute('fill', 'var(--c-exempt)'); r.setAttribute('opacity', '.3');
    svg.appendChild(r);
    wrap.appendChild(svg);
    return wrap;
  }
  let x = 0;
  for (const seg of segments) {
    if (!seg.value) continue;
    const w = (seg.value / total) * 100;
    const r = svgEl('rect');
    r.setAttribute('x', x.toFixed(2)); r.setAttribute('y', '0');
    r.setAttribute('width', w.toFixed(2)); r.setAttribute('height', '12');
    r.setAttribute('fill', TONES[seg.tone] || TONES.exempt);
    r.setAttribute('rx', '1.2');
    const t = svgEl('title');
    t.textContent = seg.label + ': ' + seg.value;
    r.appendChild(t);
    svg.appendChild(r);
    x += w;
  }
  wrap.appendChild(svg);
  const row = el('div', 'd-flex flex-wrap gap-3 mt-2');
  for (const seg of segments) {
    const item = el('span', 'd-inline-flex align-items-center gap-1 small');
    const sw = el('span', 'legend-swatch');
    sw.style.background = TONES[seg.tone] || TONES.exempt;
    item.appendChild(sw);
    item.appendChild(el('span', null, seg.label + ' (' + seg.value + ')'));
    row.appendChild(item);
  }
  wrap.appendChild(row);
  return wrap;
}

/* Verification-status semantic mapping (ADR-0001 enum; no silent blanks) */
function verificationSegments(dist) {
  const seg = (key, tone) => ({ label: key.replace(/_/g, ' '), value: dist[key] || 0, tone });
  return [
    seg('valid', 'good'),
    seg('pending', 'exempt'),
    seg('not_applicable', 'exempt'),
    seg('unknown_key', 'look'),
    seg('unsupported_schema', 'look'),
    seg('unavailable', 'act'),
  ];
}
function correlationSegments(dist) {
  const seg = (key, tone) => ({ label: key.replace(/_/g, ' '), value: dist[key] || 0, tone });
  return [
    seg('matched', 'good'),
    seg('pending', 'exempt'),
    seg('late_arrival', 'look'),
    seg('ambiguous', 'look'),
    seg('duplicate', 'act'),
    seg('receipt_missing', 'act'),
  ];
}

/* ------------------------------------------------------------ welcome + KPIs */
/* live verification counts (helpers shared by the banner and the KPI row) */
function vDist() {
  return dash && dash.verification_distribution ? dash.verification_distribution : null;
}
function vCounts() {
  const d = vDist();
  if (!d) return { rows: overview.trust.receipts_verified, valid: overview.trust.receipts_valid, src: 'pinned demo fixture set' };
  return { rows: Object.values(d).reduce((a, v) => a + v, 0), valid: d.valid || 0, src: 'live add-in now' };
}

function welcomeBanner() {
  const b = el('div', 'welcome card mb-3');
  const body = el('div', 'card-body d-flex flex-wrap align-items-center justify-content-between gap-3 py-4');
  const lead = el('div');
  lead.appendChild(el('h2', 'mb-1 fw-bold', 'Welcome back'));
  const tenantCount = overview.tenants ? overview.tenants.length : 1;
  lead.appendChild(el('div', null,
    'Tenant ' + (overview.tenants ? overview.tenants[0].label : 'default') +
    ' - one tenant, single-tenant alpha.'));
  const liveAddins = overview.addins.filter(a => a.status === 'connected').length;
  const status = el('div', 'mt-2');
  /* one honest line: add-ins live + findings posture; verified against live data */
  let verified = 'verification data pending';
  if (dash) verified = 'verification: ' + vCounts().valid + ' of ' + vCounts().rows + ' rows valid';
  else verified = 'verification: add-in offline';
  status.textContent = liveAddins + ' of ' + overview.addins.length + ' add-ins connected; ' + verified + '.';
  lead.appendChild(status);
  body.appendChild(lead);

  const actions = el('div', 'd-flex gap-2 flex-wrap');
  const btn1 = el('button', 'btn btn-light');
  btn1.textContent = 'Open Assurance';
  btn1.addEventListener('click', () => go('assurance'));
  const btn2 = el('button', 'btn btn-outline-light');
  btn2.textContent = 'Trust counters';
  btn2.addEventListener('click', () => go('trust'));
  actions.appendChild(btn1);
  actions.appendChild(btn2);
  body.appendChild(actions);
  b.appendChild(body);
  return b;
}

function statCard(iconName, iconNameBg, big, label, subNode) {
  const col = el('div', 'col-6 col-lg-3');
  const c = el('div', 'card stat-card h-100');
  const body = el('div', 'card-body d-flex gap-3 align-items-start');
  const ic = el('span', 'subicon');
  ic.style.background = iconNameBg;
  ic.style.color = '#fff';
  ic.appendChild(iconEl(iconName, 22));
  body.appendChild(ic);
  const txt = el('div', 'flex-grow-1');
  txt.appendChild(el('span', 'big', String(big)));
  txt.appendChild(el('span', 'lbl', label));
  txt.appendChild(el('div', 'sub', ''));
  if (subNode) txt.lastElementChild.appendChild(subNode);
  body.appendChild(txt);
  c.appendChild(body);
  col.appendChild(c);
  return col;
}

function kpiRow() {

  tbl.appendChild(tbody);

  explain(tableCard, 'Add-in catalogue.',
    'Suite products are add-ins purchased separately. Chips follow the semantic colours: green connected, amber degraded, grey not purchased.');

  /* recent activity feed */

    'Recent events across the suite. In the alpha this is demo data; live tenant activity lands with the tenancy epic.');

const VIEWS = {
  overview: viewOverview, trust: viewTrust, assurance: viewAssurance, red: viewRed,
  settings: viewSettings, profile: viewProfile, notifications: viewNotifications,
};

function go(route) {
  const v = VIEWS[route] || viewOverview;
  const pageEl = document.getElementById('page');
  pageEl.replaceChildren(v());
  markCurrent(route);
  history.replaceState(null, '', '#' + route);
  document.getElementById('view').scrollTop = 0;
}

/* ------------------------------------------------------------ top bar */
function buildSearch() {
  const q = document.getElementById('q');
  const box = document.getElementById('search-results');
  const render = () => {
    const needle = q.value.trim().toLowerCase();
    if (!needle) { box.classList.remove('show'); box.replaceChildren(); return; }
    const hits = [];
    for (const n of NAV) if (TITLES[n.id].toLowerCase().includes(needle)) hits.push({ label: TITLES[n.id], route: n.id });
    for (const li of (overview ? overview.activity : [])) {
      if (li.what.toLowerCase().includes(needle)) hits.push({ label: 'Activity: ' + li.what, route: 'overview' });
    }
    for (const a of (overview ? overview.addins : [])) {
      if (a.blurb.toLowerCase().includes(needle) && !hits.some(h => h.route === a.id)) {
        hits.push({ label: a.name + ' - match in description', route: a.id });
      }
    }
    box.replaceChildren();
    if (!hits.length) box.appendChild(el('div', 'text-secondary px-2 py-2 small', 'No matches.'));
    for (const h of hits.slice(0, 8)) {
      const b = el('button', null, h.label);
      b.addEventListener('click', () => { box.classList.remove('show'); q.value = ''; go(h.route); });
      box.appendChild(b);
    }
    box.classList.add('show');
  };
  q.addEventListener('input', render);
  q.addEventListener('blur', () => setTimeout(() => box.classList.remove('show'), 200));
}

function buildTopbar() {
  const bell = document.getElementById('bell');
  const badge = document.getElementById('bell-count');
  const count = overview ? overview.notifications.count : 0;
  bell.setAttribute('aria-label', 'Notifications, ' + count + ' unread');
  badge.textContent = String(count);
  badge.className = 'badge ms-1 ' + (count ? 'bg-red text-white' : 'text-secondary');
  bell.addEventListener('click', () => go('notifications'));
  const prof = document.getElementById('profile-btn');
  prof.addEventListener('click', () => go('profile'));
  buildSearch();
}

/* ------------------------------------------------------------ theme toggle */
function applyTheme(t) {
  document.documentElement.setAttribute('data-bs-theme', t);
  const btn = document.getElementById('theme-toggle');
  btn.replaceChildren(iconEl(t === 'dark' ? 'sun' : 'moon', 18));
  btn.setAttribute('aria-label', 'Switch to ' + (t === 'dark' ? 'light' : 'dark') + ' theme');
  btn.title = 'Switch to ' + (t === 'dark' ? 'light' : 'dark') + ' theme';
}
function buildTheme() {
  let t = 'light';
  try {
    const saved = window.localStorage.getItem('rc-theme');
    if (saved === 'dark' || saved === 'light') t = saved;
  } catch { /* storage unavailable: keep light */ }
  applyTheme(t);
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { window.localStorage.setItem('rc-theme', next); } catch { /* keep session-only */ }
  });
}

/* ------------------------------------------------------------ boot */
async function boot() {
  try { overview = await (await fetch('/api/overview')).json(); } catch { overview = null; }
  try { config = await (await fetch('/api/config')).json(); } catch { /* defaults kept */ }
  try {
    const r = await fetch('/api/assurance/dashboard');
    if (r.ok) dash = await r.json();
  } catch { dash = null; }
  const t = document.getElementById('tenant-label');
  const tenant = overview && overview.tenants ? overview.tenants[0] : { label: 'default' };
  t.textContent = tenant.label;
  document.getElementById('side-nav').replaceChildren();
  buildSidebar();
  buildLegend();
  buildTopbar();
  buildTheme();
  const hash = location.hash.replace('#', '');
  go(VIEWS[hash] ? hash : 'overview');
  window.addEventListener('hashchange', () => {
    const h = location.hash.replace('#', '');
    if (VIEWS[h]) go(h);
  });
}
boot();
