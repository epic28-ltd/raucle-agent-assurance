<!doctype html>

<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raucle Console</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
<style>
  /* Inter (variable, latin subset) is vendored locally under
     /static/vendor/fonts/ (SIL Open Font Licence 1.1; see vendor/fonts/
     licence-Inter-OFL.txt and NOTICE). No external font fetch at runtime. */
  @font-face{
    font-family:'Inter';
    font-style:normal;
    font-weight:100 900;
    font-display:swap;
    src:url('/static/vendor/fonts/inter-latin-var.woff2') format('woff2');
  }
  /* BEH-01 dashboard additions (Trends, rule coverage, Red preview).
     Reuses existing tokens and card classes; this block only lays out the
     new pieces (grid row, chip strip, trend legend). */
  .g-row3{grid-template-columns:3fr 1.35fr;margin-top:var(--gap)}
  .rule-strip{display:flex;flex-wrap:wrap;gap:6px}
  .rule-chip{text-decoration:none}
  .chip-look{border-color:var(--hairline);color:var(--body)}
  .chip-alert{background:var(--act-bar);border-color:var(--act-bar);color:#fff}
  .trend-legend{display:flex;gap:14px;margin-top:6px}
  .trend-key{display:inline-flex;align-items:center;gap:6px}
  @media (max-width: 900px){
    .g-row3{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="shell has-sidebar" id="shell">

  <!-- ---------------------------------------------------------- sidebar -->
  <aside class="sidebar" aria-label="Console navigation">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name">Raucle Console</span>
        <span class="brand-sub">Agent suite shell · alpha</span>
      </span>
      <button id="shell-collapse" class="brand-row-btn" type="button" aria-label="Collapse sidebar" aria-expanded="true">
        <span data-icon="panel"></span>
      </button>
    </div>
    <nav class="side-scroll" id="side-nav" aria-label="Sections"></nav>
    <p class="side-note">Single-tenant alpha. Org identity is derived by the server; no cookies.</p>
  </aside>

  <!-- ---------------------------------------------------------- main -->
  <div class="main">
    <header class="topbar">
      <div class="search">
        <span class="search-ic" data-icon="search"></span>
        <input id="q" type="search" placeholder="Search the console" aria-label="Global search">
        <kbd>/</kbd>
        <div id="search-results" class="search-results" role="listbox"></div>
      </div>
      <div style="flex:1"></div>
      <button id="bell" class="icon-btn" type="button" aria-label="Notifications">
        <span data-icon="bell"></span><span id="bell-count" class="bubble" hidden></span>
      </button>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch colour theme"></button>
      <button id="cta-primary" class="cta" type="button">Open Assurance</button>
      <div class="menu-wrap">
        <button id="avatar-btn" class="avatar" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu">RC</button>
        <div id="avatar-pop" class="menu" role="menu"></div>
      </div>
    </header>

    <div class="page-head">
      <div class="page-heading">
        <h1 class="page-title" id="page-title">Overview</h1>
        <p class="page-sub" id="page-sub">Agent suite · alpha · tenant default</p>
      </div>
    </div>

    <main class="content" id="view" tabindex="0">
      <p class="alpha-line">Alpha preview: figures reflect this session. Demo fixtures are used where an add-in is offline.</p>
      <div id="legend" class="legendbar" aria-label="Legend"></div>
      <div id="page" aria-live="polite"></div>
    </main>
  </div>
</div>

<script type="module">
/* Raucle Console SPA, quiet-SaaS design system (UI-02.3). Vanilla JS,
   textContent only (threat-model T5: no markup-injection sinks, no external
   fetches at runtime; the Inter font is vendored locally under
   /static/vendor/fonts). The only network calls this page makes are to this
   console's own API and the console-side proxy of the configured Assurance
   add-in origin. */

'use strict';

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};
/* single-line ellipsis with the full text on the title attribute */
const oneline = (node) => { node.title = node.textContent; return node; };

/* ------------------------------------------------------------ icons (inline SVG paths) */
/* SVG namespace assembled in parts so no URL literal appears in this file */
const SVG_NS = ['http:', '', 'www.w3.org', '2000', 'svg'].join('/');
const ICONS = {
  shield: ['M12 3a12 12 0 0 0 8.5 3a12 12 0 0 0 -8.5 15a12 12 0 0 0 8.5 -15a12 12 0 0 0 -8.5 -3'],
  activity: ['M3 12h4l3 8l4 -16l3 8h4'],
  alert: ['M12 9v4', 'M12 3.2l9.166 16.032a1.5 1.5 0 0 1 -1.3 2.268h-15.732a1.5 1.5 0 0 1 -1.3 -2.268l9.166 -16.032a1.5 1.5 0 0 1 2.5 0', 'M12 16h.01'],
  apps: ['M4 4h6v6h-6z', 'M14 4h6v6h-6z', 'M4 14h6v6h-6z', 'M14 14h6v6h-6z'],
  search: ['M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0', 'M21 21l-6 -6'],
  bell: ['M10 5a2 2 0 0 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6', 'M9 17a3 3 0 0 0 6 0'],
  sun: ['M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0', 'M12 3v1', 'M12 20v1', 'M3 12h1', 'M20 12h1', 'M5.6 5.6l.7 .7', 'M17.7 17.7l.7 .7', 'M5.6 18.4l.7 -.7', 'M17.7 6.3l.7 -.7'],
  moon: ['M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z'],
  panel: ['M4 4h16v16h-16z', 'M9 4v16'],
  file: ['M14 3v4a1 1 0 0 0 1 1h4', 'M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z'],
  user: ['M8 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0', 'M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2'],
  logout: ['M14 8v-2a2 2 0 0 0 -2 -2h-6a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2 -2v-2', 'M9 12h12l-3 -3m0 6l3 -3'],
  sliders: ['M6 4v6', 'M6 14v6', 'M4 10h4', 'M12 4v2', 'M12 10v10', 'M10 6h4', 'M18 4v8', 'M18 16v4', 'M16 12h4'],
  clock: ['M12 21a9 9 0 1 0 -9 -9a9 9 0 0 0 9 9', 'M11 7h1v4l3 3'],
  info: ['M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0', 'M12 9h.01', 'M11 12h1v4h1'],
  shield_check: ['M12 3l7 2.8v5.4c0 4.6-3 7.9-7 9.8-4-1.9-7-5.2-7-9.8V5.8L12 3z', 'M8.6 12.2l2.6 2.6l4.6 -5'],
  scope: ['M12 12m-8 0a8 8 0 1 0 16 0a8 8 0 1 0 -16 0', 'M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0', 'M12 2v3', 'M12 19v3', 'M2 12h3', 'M19 12h3'],
  bug: ['M13 10.5a4.5 4.5 0 0 0 -4.5 4.5a4.5 4.5 0 0 0 9 0a4.5 4.5 0 0 0 -4.5 -4.5', 'M13 10.5v-2.5', 'M11.2 8h3.6', 'M6 15h2.5', 'M17.5 15h2.5', 'M6 19h2.5', 'M17.5 19h2.5', 'M13 6.5v-1.5'],
};
function iconEl(name, size) {
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', size || 15);
  svg.setAttribute('height', size || 15);
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.5');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  for (const d of (ICONS[name] || ICONS.apps)) {
    const p = document.createElementNS(SVG_NS, 'path');
    p.setAttribute('d', d);
    svg.appendChild(p);
  }
  return svg;
}
/* fill every [data-icon] placeholder inside a node tree */
function paintIcons(root) {
  for (const holder of (root.querySelectorAll ? root.querySelectorAll('[data-icon]') : [])) {
    if (holder.firstChild) continue;
    const big = holder.classList && holder.classList.contains('side-icon') ? 19 : 16;
    holder.appendChild(iconEl(holder.dataset.icon, big));
  }
}

/* ------------------------------------------------------------ state */
let overview = null;
let dash = null;      /* add-in dashboard proxy payload; null when offline */
let counts = null;    /* add-in /api/counts proxy payload; null when offline */
let findings = null;  /* add-in findings proxy payload; null when offline  */
let trends = null;    /* per-run trend series from the console /api/trends */
let config = { assurance_url: 'http://127.0.0.1:3411', trust_gate_env: 'RAUCLE_TRUST_GATE_CONFIG', coverage_target_pct: 95 };
const COVERAGE_DEFAULT = 95;

const PILL_NAME = { connected: 'Connected', degraded: 'Degraded', not_purchased: 'Not purchased' };
const PILL_TONE = { connected: 'tok-good', degraded: 'tok-look', not_purchased: 'tok-exempt' };
const pill = (status) => el('span', ['pill', PILL_TONE[status] || 'tok-exempt'].join(' '), PILL_NAME[status] || 'Unknown');
/* severity maps to the semantic tint scale: red action needed, amber
   un-proven, grey exempt (UI-02.5 QA blocker 2) */
const SEV_TONE = { high: 'tok-act', critical: 'tok-act', medium: 'tok-look', moderate: 'tok-look', low: 'tok-exempt', info: 'tok-exempt' };
const sevPill = (sev) => {
  const name = (sev || 'unknown').toLowerCase();
  return el('span', ['pill', 'num', SEV_TONE[name] || 'tok-exempt'].join(' '), name + ' severity');
};
const dotCls = (status) => status === 'connected' ? 'side-dot dot-good'
  : status === 'degraded' ? 'side-dot dot-look' : 'side-dot';

const relativeTime = (ts, fallback) => {
  if (ts) {
    const t = Date.parse(ts);
    if (!Number.isNaN(t)) {
      let s = Math.max(0, Math.round((Date.now() - t) / 1000));
      if (s < 60) return s < 10 ? 'just now' : s + 's ago';
      const m = Math.round(s / 60);
      if (m < 60) return m + 'm ago';
      const h = Math.round(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.round(h / 24) + 'd ago';
    }
  }
  return fallback || 'in the current window';
};

/* ------------------------------------------------------------ card builder */
function card(title, qualifier) {
  const root = el('section', 'card');
  const hd = el('div', 'card-hd');
  hd.appendChild(oneline(el('h3', 'card-title', title)));
  if (qualifier) hd.appendChild(oneline(el('span', 'card-qual', qualifier)));
  root.appendChild(hd);
  const body = el('div'); body.className = 'card-body'; root.appendChild(body);
  const ft = el('div', 'card-ft'); root.appendChild(ft);
  const owner = {
    body, root, ft,
    explain(text) {
      ft.replaceChildren();
      /* one info icon per card whose explainer lives in a CSS-only
         hover/focus popover, out of the visible flow */
      const wrap = el('span', 'info-wrap');
      const btn = el('button', 'what-btn');
      btn.type = 'button';
      btn.setAttribute('aria-label', 'What is this?');
      const pop = el('span', 'what-line info-pop');
      pop.setAttribute('role', 'tooltip');
      pop.appendChild(el('strong', null, 'What is this?'));
      pop.appendChild(el('div', null, text));
      btn.appendChild(pop);
      wrap.appendChild(btn);
      ft.appendChild(wrap);
    },
    footer(node) { ft.replaceChildren(node); },
  };
  return owner;
}

/* ------------------------------------------------------------ chart tones */
const TONE = { good: 'var(--good-bar)', look: 'var(--look-bar)', act: 'var(--act-bar)', exempt: 'var(--exempt-bar)', plum: 'var(--plum)' };

/* ------------------------------------------------------------------ gauge */
function gaugeCard(health) {
  const c = card('Verification health', 'share of receipts verifying valid · ' + (health.source_label || 'demo'));
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 128 128');
  svg.setAttribute('width', '128');
  svg.setAttribute('height', '128');
  const R = 52, C = 2 * Math.PI * R;
  const track = document.createElementNS(SVG_NS, 'circle');
  track.setAttribute('cx', '64'); track.setAttribute('cy', '64'); track.setAttribute('r', R);
  track.setAttribute('fill', 'none'); track.setAttribute('stroke', 'var(--track)');
  track.setAttribute('stroke-width', '13');
  svg.appendChild(track);
  const share = health.rows ? health.valid / health.rows : 0;
  const arc = document.createElementNS(SVG_NS, 'circle');
  arc.setAttribute('cx', '64'); arc.setAttribute('cy', '64'); arc.setAttribute('r', R);
  arc.setAttribute('fill', 'none'); arc.setAttribute('stroke', 'var(--accent)');
  arc.setAttribute('stroke-width', '13');
  arc.setAttribute('stroke-linecap', 'round');
  const dashLen = Math.max(0.0001, share * C);
  arc.setAttribute('stroke-dasharray', dashLen.toFixed(2) + ' ' + (C - dashLen).toFixed(2));
  arc.setAttribute('stroke-dashoffset', (C / 4).toFixed(2));
  /* the arc is the valid share only; the track is everything else */
  const t = document.createElementNS(SVG_NS, 'title');
  t.textContent = health.valid + ' of ' + health.rows + ' receipts verify valid';
  svg.appendChild(t);
  let wrapped = false;
  svg.childNodes.forEach(() => { wrapped = true; });
  svg.insertBefore(arc, svg.childNodes[1]);
  svg.replaceChild(arc, svg.childNodes[1]);
  const g = el('div', 'gauge');
  const num = el('div', 'g-num');
  num.appendChild(el('span', 'g-big num', String(health.valid)));
  num.appendChild(el('span', 'g-cap', health.caption));
  g.appendChild(svg);
  g.appendChild(num);
  c.body.appendChild(g);
  const foot = el('div', 'gauge-foot');
  /* same bucket taxonomy as the Evidence states card (UI-02.5 blocker 5) */
  const d = health.dist;
  const nValid = d.valid || 0;
  const nInv = (d.unsupported_schema || 0) + (d.invalid || 0);
  const nEx = (d.unavailable || 0) + (d.not_applicable || 0);
  const nUnp = Math.max(0, health.rows - nValid - nInv - nEx);
  const footCell = (cls, label, n) => {
    const s = el('span', cls + ' num');
    s.textContent = (label === 'valid' ? '+' : '') + n + ' ' + label;
    return s;
  };
  if (nValid + nUnp + nInv + nEx) {
    foot.appendChild(footCell('tint-good', 'valid', nValid));
    if (nUnp) foot.appendChild(footCell('tint-look', 'un-proven', nUnp));
    if (nInv) foot.appendChild(footCell('tint-act', 'unaccounted', nInv));
    if (nEx) foot.appendChild(footCell('tint-exempt', 'exempt', nEx));
  } else {
    foot.appendChild(footCell('tint-look', 'un-proven', health.unproven));
  }
  c.body.appendChild(foot);
  c.footer(el('span', 'muted small', health.src));
  c.explain('The arc is the share of receipts that verify valid. Valid is proven; un-proven covers unknown key and pending, unaccounted is the invalid class, and unavailable receipts are shown as exempt.');
  return c.root;
}

/* ------------------------------------------------------------------ bars */
function stateBarRow(name, count, total, tone, opts) {
  const o = opts || {};
  const row = el('div', 'state-row');
  const hd = el('div', 'state-hd');
  hd.appendChild(el('span', null, name));
  if (o.pillText) hd.appendChild(el('span', 'pill ' + (o.pillTone || 'tok-exempt'), o.pillText));
  hd.appendChild(el('span', 'count num', count + ' of ' + total));
  row.appendChild(hd);
  const bar = el('div', 'bar');
  const fill = el('div', 'bar-fill');
  const pct = total ? Math.min(100, (count / total) * 100) : 0;
  fill.style.width = pct.toFixed(1) + '%';
  fill.style.background = TONE[tone] || TONE.exempt;
  fill.title = name + ': ' + count + ' of ' + total + ' (' + Math.round(pct) + '%)';
  bar.appendChild(fill);
  if (o.target !== undefined) {
    const tick = el('span', 'bar-tick');
    /* sit the allowance line exactly at the target share of the track width */
    tick.style.left = 'calc(' + o.target + '% - 1px)';
    tick.title = 'Coverage allowance line: ' + (100 - o.target) + '%';
    bar.appendChild(tick);
  }
  row.appendChild(bar);
  return row;
}

function statesCard(dist, total, target) {
  const c = card('Evidence states', 'receipt share per verification state');
  const unkShare = total ? (dist.unknown_key || 0) / total * 100 : 0;
  const allowed = 100 - target;
  const ok = unkShare <= allowed + (total ? 1 / total * 100 : 0);
  c.body.appendChild(stateBarRow('Valid', dist.valid || 0, total, 'good'));
  c.body.appendChild(stateBarRow('Unknown key', dist.unknown_key || 0, total, 'look', {
    target,
    pillText: ok ? 'In coverage' : 'Needs attention',
    pillTone: ok ? 'tok-good' : 'tok-act',
  }));
  /* pending is un-proven (amber) and not applicable is exempt (grey); every
     verification state gets a bar so the rows sum to the row total (UI-02.5
     blocker 5) and reconcile with the Evidence verified card and the shared
     counting module buckets */
  c.body.appendChild(stateBarRow('Pending', dist.pending || 0, total, 'look'));
  c.body.appendChild(stateBarRow('Unsupported schema', dist.unsupported_schema || 0, total, 'act'));
  c.body.appendChild(stateBarRow('Invalid', dist.invalid || 0, total, 'act'));
  c.body.appendChild(stateBarRow('Unavailable', dist.unavailable || 0, total, 'exempt'));
  c.body.appendChild(stateBarRow('Not applicable', dist.not_applicable || 0, total, 'exempt'));
  const wrap = el('div');
  wrap.style.marginTop = '14px';
  wrap.appendChild(el('span', 'muted small num', 'Coverage target: ' + target + '% of rows verify or are exempt; the tick on the unknown-key bar is the ' + allowed + '% allowance (from the console config).'));
  c.body.appendChild(wrap);
  c.footer(el('span', 'muted small', 'State names follow the ADR-0001 verification enum; nothing is hidden as blank.'));
  c.explain('Each bar is one receipt state as a share of all rows. The black tick is the coverage allowance the suite is held to; the pill flips to Needs attention when the bar passes it.');
  return c.root;
}

/* ------------------------------------------------------------------ findings */
function findingsCard(list, offline) {
  const c = card('Findings', offline ? 'add-in offline' : 'this demo window');
  if (offline || !list || !list.length) {
    c.body.appendChild(el('p', 'muted', offline
      ? 'The findings feed is unavailable while the add-in is offline; nothing is shown rather than a stale list.'
      : 'No findings in the current window.'));
    c.footer(el('span', 'muted small', 'Suppressed findings are retained with their documented reason.'));
    c.explain('Findings are raised by the rules harness over the evidence plane and verified offline. Suppressed ones stay on the record with their reason.');
    return c.root;
  }
  for (const f of list) {
    const r = el('div', 'rowline');
    const t = el('div', 'tile' + (f.suppressed ? '' : (f.severity === 'high' || f.severity === 'critical' ? ' bad' : ' warn')));
    t.appendChild(iconEl(f.suppressed ? 'file' : 'alert', 13));
    r.appendChild(t);
    const main = el('div', 'grow');
    const l1 = el('div');
    l1.appendChild(el('b', null, f.rule_id));
    if (f.subject) l1.appendChild(el('span', 'muted small', ' · ' + f.subject));
    main.appendChild(l1);
    if (f.explanation) main.appendChild(oneline(el('span', 'why', f.explanation)));
    r.appendChild(main);
    const meta = el('div', 'row-rail');
    meta.appendChild(sevPill(f.severity));
    if (f.suppressed) {
      /* grey outline chip, not plain low-contrast text (UI-02.5 blocker 3) */
      meta.appendChild(el('span', 'chip chip-exempt', 'suppressed with reason'));
    }
    r.appendChild(meta);
    c.body.appendChild(r);
    if (f.suppressed && f.suppression_reason) {
      /* label/value mini-grid beneath the row, full width, aligned with it */
      const sr = el('div', 'rowline supp-row');
      sr.appendChild(el('span', 'supp-label', 'Suppression reason'));
      sr.appendChild(el('span', 'supp-value muted small', f.suppression_reason));
      c.body.appendChild(sr);
    }
  }
  /* counts footer from the SHARED counting module (via /api/assurance/counts
     live, or the console's own overview fallback): open + closed =
     suppressed reconciles everywhere; no local re-computation */
  const fc = counts && counts.findings ? counts.findings
    : (overview && overview.trust && overview.trust.findings ? overview.trust.findings : null);
  const footSpan = fc
    ? el('span', 'muted small', 'Counts (shared module): open ' + fc.lens.open
        + ' (needs investigation ' + fc.lens.needs_investigation
        + ' · unproven ' + fc.lens.unproven
        + ' · coverage gaps ' + fc.lens.coverage_gaps
        + ') + suppressed ' + fc.suppressed
        + (fc.closed ? ' + closed ' + fc.closed : '')
        + ' = ' + fc.total + ' findings.')
    : el('span', 'muted small', 'Counts unavailable: add-in offline.');
  const boardLink = el('a', 'board-link', 'Open findings board');
  boardLink.href = config.assurance_url.replace(/\/$/, '') + '/#/findings';
  boardLink.target = '_blank';
  boardLink.rel = 'noreferrer';
  footSpan.appendChild(document.createTextNode(' · '));
  footSpan.appendChild(boardLink);
  c.footer(footSpan);
  c.explain('Active findings need an investigator. Suppressed findings are retained on purpose, each with its documented reason, so nothing disappears silently.');
  return c.root;
}

/* ------------------------------------------------------------------ activity */
const FEED_ICONS = { index: 'apps', receipts: 'shield', shell: 'activity' };
function activityCard(activity) {
  const c = card('Recent activity', 'across the suite');
  for (const item of activity) {
    const r = el('div', 'rowline');
    const t = el('div', 'tile');
    t.appendChild(iconEl(FEED_ICONS[item.kind] || 'activity', 13));
    r.appendChild(t);
    const main = el('div', 'grow');
    main.appendChild(el('div', null, item.what));
    r.appendChild(main);
    const when = relativeTime(item.ts, item.when);
    r.appendChild(el('span', 'when', when));
    c.body.appendChild(r);
  }
  c.footer(el('span', 'muted small', 'Times are measured from the console boot moment on the server; they age as the session runs.'));
  c.explain('Recent events across the suite. Live tenant activity lands with the tenancy epic; the alpha shows the demo fixture provenance.');
  return c.root;
}

/* evidence verified: big number + stacked rounded-cap bar + dot legend.
   Bucket taxonomy matches the Evidence states card exactly (UI-02.5
   blocker 5): green valid, amber un-proven, red invalid class, grey exempt. */
/* ------------------------------------------------------------------ trends */
/* BEH-01 'Trends': per-run bucket series over ingested runs. The demo
   fixture set carries individual runs (not aligned ingestion windows), so
   the chart is honestly labelled 'per run'; window-aligned series land
   with the windowing epic. Inline SVG, hand-computed polyline points. */
function trendsCard(series) {
  const c = card('Trends', series && series.kind ? series.kind + ' series' : 'per run');
  const pts = (series && series.points ? series.points : []).slice(-7);
  const wrap = el('div', 'trend');
  if (!pts.length) {
    c.body.appendChild(el('p', 'muted', 'No run series available yet: ingest a run and its verification buckets appear here.'));
    c.footer(el('span', 'muted small', 'Series labels are honest: points are per run, not per window.'));
    c.explain('One line per verification bucket over the last ingested runs. The demo fixtures ship individual runs, so this is a per-run series until windowed ingestion lands.');
    return c.root;
  }
  const W = 320, H = 124, PAD = 8, PLOT_H = 106;
  const maxV = Math.max(1, ...pts.flatMap((p) => [p.valid, p.unproven, p.unaccounted]));
  const xy = (i, v) => [
    PAD + (i * (W - 2 * PAD)) / (pts.length - 1 || 1),
    PLOT_H - PAD - ((v || 0) / maxV) * (PLOT_H - 2 * PAD),
  ];
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('width', '100%');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Per-run trends of valid, un-proven and unaccounted counts');
  const sers = [
    { key: 'valid', tone: 'good', stroke: TONE.good },
    { key: 'unproven', tone: 'look', stroke: TONE.look, label: 'un-proven' },
    { key: 'unaccounted', tone: 'act', stroke: TONE.act },
  ];
  for (const s of sers) {
    const dPts = pts.map((p, i) => xy(i, p[s.key]).map((n) => n.toFixed(1)).join(','));
    const line = document.createElementNS(SVG_NS, 'polyline');
    line.setAttribute('points', dPts.join(' '));
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', s.stroke);
    line.setAttribute('stroke-width', '2');
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('stroke-linejoin', 'round');
    line.classList.add('trend-line');
    line.dataset.series = s.key;
    const t = document.createElementNS(SVG_NS, 'title');
    t.textContent = s.key + ' per run (latest: ' + pts[pts.length - 1][s.key] + ')';
    line.appendChild(t);
    svg.appendChild(line);
    for (let i = 0; i < pts.length; i++) {
      const [cx, cy] = xy(i, pts[i][s.key]);
      const dot = document.createElementNS(SVG_NS, 'circle');
      dot.setAttribute('cx', cx.toFixed(1));
      dot.setAttribute('cy', cy.toFixed(1));
      dot.setAttribute('r', '2.5');
      dot.setAttribute('fill', s.stroke);
      dot.classList.add('trend-dot');
      dot.dataset.series = s.key;
      dot.dataset.label = pts[i].label;
      dot.dataset.value = String(pts[i][s.key]);
      svg.appendChild(dot);
    }
  }
  /* honest x labels: first and last run ids */
  const lab = (x, txt, anchor) => {
    const t = document.createElementNS(SVG_NS, 'text');
    t.setAttribute('x', x);
    t.setAttribute('y', H - 1);
    t.setAttribute('font-size', '8');
    t.setAttribute('fill', 'var(--muted)');
    t.setAttribute('text-anchor', anchor);
    t.textContent = txt;
    return t;
  };
  svg.appendChild(lab(String(PAD), pts[0].label, 'start'));
  svg.appendChild(lab(String(W - PAD), pts[pts.length - 1].label, 'end'));
  wrap.appendChild(svg);
  const legend = el('div', 'trend-legend');
  for (const s of sers) {
    const line = el('span', 'trend-key');
    const d = el('span', 'dot-lg');
    d.style.background = s.stroke;
    line.appendChild(d);
    line.appendChild(el('span', 'muted small', s.label || s.key));
    legend.appendChild(line);
  }
  wrap.appendChild(legend);
  c.body.appendChild(wrap);
  c.footer(el('span', 'muted small', series && series.note
    ? series.note + '; latest run: valid ' + pts[pts.length - 1].valid
    + ', un-proven ' + pts[pts.length - 1].unproven
    + ', unaccounted ' + pts[pts.length - 1].unaccounted + '.'
    : 'Per-run series from the shared counting module.'));
  c.explain('Per-run verification buckets over the last ingested runs. Valid is proven (green), un-proven needs a decision (amber), unaccounted is the invalid class (red). The demo set has no aligned windows yet, so this is a per-run series by honest label.');
  return c.root;
}

/* ------------------------------------------------------- rule coverage strip */
/* Which SEC rules fired in this window: chips with counts over SEC-001..006;
   rules with nothing in the window show as grey silent chips (never hidden). */
const COVERAGE_RULES = ['SEC-001', 'SEC-002', 'SEC-003', 'SEC-004', 'SEC-005', 'SEC-006'];
function ruleCoverageCard(list, offline) {
  const c = card('Rule coverage', 'SEC rules that fired in this window');

  for (const f of (list || [])) {

  }
  for (const rid of COVERAGE_RULES) {
    const n = counts[rid] || 0;
    const chip = el(n
      ? 'a'

      ? ['chip rule-chip', n >= 3 ? 'chip-alert' : 'chip-look'].join(' ')
      : 'chip chip-exempt rule-chip');

/* ------------------------------------------------------------------ guidance */
function pickGuidance(vd, cd, flist, offline) {
  const n = (k) => vd && vd[k] || 0;
  const nCorr = (k) => cd && cd[k] || 0;
  const rules = new Set((flist || []).map(f => f.rule_id));
  const activeExpl = (id, s) => (flist || []).some(f => f.rule_id === id && !f.suppressed && (f.explanation || '').includes(s));
  /* banner tint follows the severity of the priority finding (UI-02.5
     blocker 1): red action needed, amber un-proven, mint green all clear */
  const firstRef = (ruleId, substr) => {
    const f = (flist || []).find((x) => x.rule_id === ruleId && !x.suppressed
      && (substr === undefined || (x.explanation || "").includes(substr)));
    return f && f.primary_ref ? f.primary_ref : (f && f.id ? String(f.id) : null);
  };
  const pair = (tone, headline, detail, ref) => ({ tone, headline, detail, ref });
  if (offline) {
    return pair('look', 'Add-in offline: the Assurance add-in is not reachable right now.',
      'Start the add-in process; the console will then show live verification, correlation and findings here instead of the pinned demo figures.');
  }
  if (n('invalid') || activeExpl('SEC-002', 'invalid')) {
    return pair('act', 'At least one receipt verifies as invalid in the live window (SEC-002).',
      'Open the Assurance add-in, find the affected receipt and re-run verification before anything downstream relies on the record.',
      firstRef('SEC-002', 'invalid'));
  }
  if (rules.has('SEC-009')) {
    return pair('act', 'Bypass is suspected: a privileged tool appears to have executed with no gate receipt.',
      'Check the tool host the finding points at; every privileged execution should have left a gate receipt.',
      firstRef('SEC-009'));
  }
  if (nCorr('receipt_missing') || rules.has('SEC-001')) {
    return pair('act', 'A privileged tool call is missing its gate receipt after the grace window (SEC-001).',
      'Confirm whether the tool call was gated at all, then re-record or document the gap so the trace is complete.',
      firstRef('SEC-001'));
  }
  if (n('unsupported_schema') || rules.has('SEC-002')) {
    return pair('look', 'A receipt uses a schema this verifier does not support, so it cannot be verified.',
      'Bring the verifier schema set up to the receipt format in use, then verify again; nothing is proven until the schema is understood.',
      firstRef('SEC-002'));
  }
  const amb = nCorr('ambiguous');
  if (amb) {
    return pair('look', amb + ' tool-call receipt' + (amb > 1 ? 's correlate' : ' correlates') + ' ambiguously: more matching receipts than trace items point at.',
      'Resolve the ingest duplication before reporting on these traces, since the correlation cannot be proven either way yet.');
  }
  if (nCorr('duplicate')) {
    const d = nCorr('duplicate');
    return pair('look', d + ' trace record' + (d > 1 ? 's are' : ' is') + ' marked as an ingest duplicate.',
      'Deduplicate the ingest feed so the window reflects real tool calls, then re-open the affected traces.');
  }
  return pair('good', 'The suite is calm: no invalid or unsupported receipts and no missing receipts in the current window.',
    'Nothing is waiting on you; the next thing worth watching is the unknown-key share staying inside the coverage allowance.');
}

function guidanceBanner() {
  const vd = dash && dash.verification_distribution ? dash.verification_distribution : null;
  const cd = dash && dash.correlation_distribution ? dash.correlation_distribution : null;
  const g = (dash || findings)

function vState() {
  /* Live branch: the add-in dashboard (shared counting module output). */
  const d = dash && dash.verification_distribution ? dash.verification_distribution : null;
  if (d) {
    const dist = { valid: 0, pending: 0, not_applicable: 0, unknown_key: 0, unsupported_schema: 0, unavailable: 0, ...(d || {}) };
    const rows = dash.buckets ? dash.buckets.valid + dash.buckets.unproven + dash.buckets.unaccounted + dash.buckets.exempt
      : Object.values(d).reduce((a, v) => a + v, 0);
    return {
      buckets: dash.buckets || null,
      dist, rows,
      valid: dist.valid, unproven: rows - dist.valid,
      src: 'Shared counting module over the demo fixture set, fetched this session via the add-in.',
      source_label: 'live add-in',
      caption: 'verified',
    };
  }
  /* Offline branch falls back to the shared counting module output the
     console server derived into /api/overview - never pinned numbers, so
     the offline figures agree with the add-in's own /api/counts. */
  const t = overview && overview.trust ? overview.trust : null;
  const dist = { valid: 0, pending: 0, not_applicable: 0, unknown_key: 0, unsupported_schema: 0, unavailable: 0, ...((t && t.verification_distribution) || {}) };

    ? t.verification_buckets.valid + t.verification_buckets.unproven + t.verification_buckets.unaccounted + t.verification_buckets.exempt
    : 0;
  const valid = t && t.verification_buckets ? t.verification_buckets.valid : (dist.valid || 0);
  return {
    buckets: t && t.verification_buckets ? t.verification_buckets : null,
    dist, rows,
    valid, unproven: rows - valid,
    src: 'Shared counting module over the pinned demo fixture set; the add-in is offline.',

}

  // leave their own signed receipts. Shown here from the red repo corpora.
  const dog = el('div', 'card');
  dog.style.margin = '12px 0';
  const dogTitle = el('div', 'card-title', 'Own receipts (dogfooding)');
  dog.appendChild(dogTitle);
  const dogWrap = el('p', 'muted', 'Reading the red agent receipt trail...');
  dog.appendChild(dogWrap);
  c.body.appendChild(dog);
  fetch('/api/red/dogfood').then(r => r.json()).then(d => {
    if (!d || !d.available) { dogWrap.textContent = 'Red corpora not found locally: dogfood counters unavailable (nothing guessed).'; return; }
    dogWrap.textContent = 'Every attack this product makes is itself gated: ' + d.receipted + ' of ' + d.attempts + ' red attempts left a signed receipt (' + d.share + '%). Findings emitted: ' + d.findings_total + ' (by severity: ' + Object.entries(d.findings_by_severity).map(([k, v]) => k + ' ' + v).join(', ') + ').';
  });
  const note = el('p'); note.style.margin = '10px 0';
  note.textContent = 'Wave 2 in build. The gate fuzzer already runs against your policies; every attack it attempts is itself gated and receipted.';
  c.body.appendChild(note);
  // Ingested red findings (RED-INTEGRATION): what the Red product has already
  // posted into the Assurance intake, read from the add-in this session.
  const ing = el('div', 'card');
  ing.style.margin = '12px 0';
  ing.appendChild(el('div', 'card-title', 'Ingested red findings'));
  const ingWrap = el('p', 'muted', 'Reading the Assurance intake...');
  ing.appendChild(ingWrap);
  c.body.appendChild(ing);
  fetch(config.assurance_url.replace(/\/$/, '') + '/api/findings/red').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
    ing.textContent = '';
    const n = Object.values(d.by_severity).reduce((a, v) => a + v, 0);
    ing.appendChild(el('p', null, n ? 'Ingested into the findings board (source red-mvp): ' + n + ' findings. ' : 'No red findings ingested yet.'));
    if (n) {
      const parts = Object.entries(d.by_severity).filter(([, v]) => v).map(([k, v]) => k + ' ' + v);
      ing.appendChild(el('p', 'muted', 'By severity: ' + parts.join(', ') + '.'));
      if (d.findings.length) {
        const latest = d.findings[d.findings.length - 1];
        ing.appendChild(el('p', 'muted', 'Latest: ' + latest.rule_id + ' (' + latest.severity + ') - ' + latest.explanation));
      }
      const link = el('a', 'board-link', 'Open the Assurance findings board (Red findings tagged red-mvp)');
      link.href = config.assurance_url.replace(/\/$/, '') + '/index.html';
      link.target = '_blank';
      link.rel = 'noreferrer';
      const pl = el('p'); pl.style.margin = '6px 0 0'; pl.appendChild(link);
      ing.appendChild(pl);
    }
  }).catch(() => { ingWrap.textContent = 'Ingested red findings unavailable (Assurance add-in offline; nothing guessed).'; });
  const ul = el('ul', 'quiet');
  ['Adversarial tool-content scenarios', 'Policy edge-case sweeps', 'Reporting that pairs with Raucle Agent Assurance'].forEach(x => ul.appendChild(el('li', null, x)));
  c.body.appendChild(ul);
  c.footer(el('span', 'muted small', 'Included with licence key once available - pricing tiers are not shown in product pages.'));
  c.explain('Raucle Agent Red will attack your agents the way a real caller would: hostile instructions, ambiguous inputs and policy edges. Not purchasable yet.');
  p.appendChild(c.root);
  return p;
}

/* ------------------------------------------------------------------ tips */
/* one shared positioned tooltip div for every chart segment; textContent
   only, positioned from the pointer, kept inside the viewport */
const tipNode = () => document.getElementById('tip');
function hookTip(node, text) {
  node.addEventListener('pointerenter', () => {
    const t = tipNode();
    if (!t) return;
    t.textContent = text;
    t.style.display = 'block';
  });
  node.addEventListener('pointermove', (e) => {
    const t = tipNode();
    if (!t) return;
    t.style.left = Math.min(e.clientX + 12, window.innerWidth - t.offsetWidth - 8) + 'px';
    t.style.top = Math.max(e.clientY - t.offsetHeight - 10, 8) + 'px';
  });
  node.addEventListener('pointerleave', () => {
    const t = tipNode();
    if (t) t.style.display = 'none';
  });
}
/* register tips for each chart segment after a view renders */
function attachTips(pageEl) {
  const t = tipNode();
  if (t) { t.style.display = 'none'; t.textContent = ''; }
  for (const seg of pageEl.querySelectorAll('.bar-fill, .stack > span')) {
    if (seg.title) hookTip(seg, seg.title);
  }
  for (const arc of pageEl.querySelectorAll('.gauge svg [stroke-linecap="round"]')) {
    const title = arc.querySelector('title');
    if (title) hookTip(arc, title.textContent);
  }
  for (const dot of pageEl.querySelectorAll('.trend-dot')) {
    hookTip(dot, dot.dataset.label + ': ' + dot.dataset.series + ' = ' + dot.dataset.value);
  }
  for (const dot of pageEl.querySelectorAll('.trend-line')) {
    const title = dot.querySelector('title');
    if (title) hookTip(dot, title.textContent);
  }
}

/* ------------------------------------------------------------------ router */
const NAV = [
  { id: 'overview', label: 'Overview', group: 'suite', icon: 'apps' },
  { id: 'trust', label: 'Raucle Agent Trust', group: 'products', icon: 'shield_check' },
  { id: 'assurance', label: 'Raucle Agent Assurance', group: 'products', icon: 'scope' },
  { id: 'red', label: 'Raucle Agent Red', group: 'products', icon: 'bug' },
  { id: 'settings', label: 'Settings', group: 'account', icon: 'sliders' },
  { id: 'profile', label: 'Profile', group: 'account', icon: 'user' },
  { id: 'notifications', label: 'Notifications', group: 'account', icon: 'bell' },
];
const TITLES = Object.fromEntries(NAV.map(n => [n.id, n.label]));
const VIEWS = {
  overview: viewOverview, trust: viewTrust, assurance: viewAssurance, red: viewRed,
  settings: viewSettings, profile: viewProfile, notifications: viewNotifications,
};

function buildSidebar() {
  const nav = document.getElementById('side-nav');
  nav.replaceChildren();
  const groups = [['suite', 'Suite'], ['products', 'Products'], ['account', 'Tenant']];
  for (const [gid, glabel] of groups) {
    nav.appendChild(el('div', 'side-section', glabel));
    for (const item of NAV.filter(n => n.group === gid)) {
      const a = el('a', 'side-item');
      a.href = '#' + item.id;
      a.dataset.route = item.id;
      a.title = item.label;
      const status = overview && overview.addins ? overview.addins.find(x => x.id === item.id) : null;
      const iconHolder = el('span', 'side-icon');
      iconHolder.dataset.icon = item.icon;
      a.appendChild(iconHolder);
      a.appendChild(el('span', status ? dotCls(status.status) : 'side-dot dot-good'));
      a.appendChild(el('span', 'side-text', item.label));
      if (item.id === 'notifications') {
        /* unread count lives in the top bar only, so the count is not
         duplicated in two surfaces */
      } else if (item.group === 'products') {
        /* honest small counters: run count only once, from the dashboard */
      }
      nav.appendChild(a);
    }
  }
  paintIcons(nav);
}

function buildLegend() {
  const legend = document.getElementById('legend');
  legend.replaceChildren();
  legend.appendChild(el('span', null, 'Legend:'));
  const row = (tone, label) => legend.appendChild(el('span', 'pill ' + tone, label));
  row('tok-good', 'proven / connected');
  row('tok-look', 'un-proven / degraded');
  row('tok-act', 'action needed');
  row('tok-exempt', 'exempt / not purchased');
}

function markCurrent(route) {
  document.querySelectorAll('[data-route]').forEach(n => {
    if (n.dataset.route === route) {
      n.setAttribute('aria-current', 'page');
      if (n.classList.contains('nav-link')) n.classList.add('active');
    } else {
      n.removeAttribute('aria-current');
      n.classList.remove('active');
    }
  });
}

function go(route) {
  /* drill routes: #/rules/<rule-id> renders the per-rule drill view */
  const clean = route.replace(/^\//, '');
  const ruleMatch = /^rules\/([A-Z]{3}-[0-9]{3})$/.exec(clean);
  const v = ruleMatch
    ? (() => { return viewRule(ruleMatch[1]); })
    : (VIEWS[clean] || viewOverview);
  const pageEl = document.getElementById('page');
  pageEl.replaceChildren(v());
  paintIcons(pageEl);
  markCurrent(clean);
  history.replaceState(null, '', '#' + clean);
  document.getElementById('page-title').textContent = ruleMatch
    ? ruleMatch[1] + ' drill'
    : (TITLES[clean] || 'Overview');
  document.getElementById('cta-primary').hidden = clean === 'assurance';
  document.getElementById('view').scrollTop = 0;
  /* keep relative feed labels honest as the session ages */
  const els = document.querySelectorAll('#page .rowline .when');
  els.forEach(node => { /* re-rendered on each navigation */ });
  attachTips(pageEl);
}

/* ------------------------------------------------------------------ topbar */
function buildSearch() {
  const q = document.getElementById('q');
  const box = document.getElementById('search-results');
  const render = () => {
    const needle = q.value.trim().toLowerCase();
    if (!needle) { box.classList.remove('show'); box.replaceChildren(); return; }
    const hits = [];
    for (const n of NAV) if (n.label.toLowerCase().includes(needle)) hits.push({ label: n.label, route: n.id });
    for (const li of (overview ? overview.activity : [])) {
      if (li.what.toLowerCase().includes(needle)) hits.push({ label: 'Activity: ' + li.what, route: 'overview' });
    }
    for (const a of (overview ? overview.addins : [])) {
      if (a.blurb.toLowerCase().includes(needle) && !hits.some(h => h.route === a.id)) {
        hits.push({ label: a.name + ' - match in description', route: a.id });
      }
    }
    box.replaceChildren();
    if (!hits.length) box.appendChild(el('div', 'muted', 'No matches.'));
    for (const h of hits.slice(0, 8)) {
      const b = el('button', null, h.label);
      b.addEventListener('click', () => { box.classList.remove('show'); q.value = ''; go(h.route); });
      box.appendChild(b);
    }
    box.classList.add('show');
  };
  q.addEventListener('input', render);
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== q) { q.focus(); e.preventDefault(); }
  });
  q.addEventListener('blur', () => setTimeout(() => box.classList.remove('show'), 200));
}

function buildTopbar() {
  const bell = document.getElementById('bell');
  const badge = document.getElementById('bell-count');
  const count = overview ? overview.notifications.count : 0;
  bell.setAttribute('aria-label', 'Notifications, ' + count + ' unread');
  badge.hidden = !count;
  badge.textContent = String(count);
  bell.addEventListener('click', () => go('notifications'));
  /* avatar dropdown: Profile, Settings, Sign out (alpha-disabled) */
  const menu = document.getElementById('avatar-pop');
  const menuItems = [
    ['Profile', 'user', () => go('profile')],
    ['Settings', 'sliders', () => go('settings')],
    ['Sign out', 'logout', null],
  ];
  for (const [label, ic, fn] of menuItems) {
    const b = el('button');
    b.type = 'button';
    b.appendChild(iconEl(ic, 14));
    b.appendChild(el('span', null, label));
    if (!fn) {
      b.disabled = true;
      b.title = 'Disabled in the single-tenant alpha';
      b.setAttribute('aria-disabled', 'true');
    } else {
      b.addEventListener('click', () => { menu.classList.remove('show'); fn(); });
    }
    menu.appendChild(b);
  }
  menu.appendChild(el('div', 'muted small', 'Sign out lands in a later epic.'));
  menu.lastElementChild.style.padding = '4px 10px';
  const btn = document.getElementById('avatar-btn');
  btn.addEventListener('click', () => {
    const open = !menu.classList.contains('show');
    menu.classList.toggle('show', open);
    btn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', (e) => {
    if (!menu.contains(e.target) && !btn.contains(e.target)) { menu.classList.remove('show'); btn.setAttribute('aria-expanded', 'false'); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { menu.classList.remove('show'); btn.setAttribute('aria-expanded', 'false'); }
  });
  document.getElementById('cta-primary').addEventListener('click', () => go('assurance'));
  buildSearch();
}

/* ------------------------------------------------------------------ collapse */
function buildCollapse() {
  const shell = document.getElementById('shell');
  const btn = document.getElementById('shell-collapse');
  let collapsed = false;
  try { collapsed = window.localStorage.getItem('rc-collapsed') === '1'; } catch { /* keep open */ }
  const apply = () => {
    shell.classList.toggle('collapsed', collapsed);
    button();
  };
  const button = () => {
    btn.setAttribute('aria-expanded', String(!collapsed));
    btn.setAttribute('aria-label', collapsed ? 'Expand sidebar' : 'Collapse sidebar');
  };
  apply();
  btn.addEventListener('click', () => {
    collapsed = !collapsed;
    apply();
    try { window.localStorage.setItem('rc-collapsed', collapsed ? '1' : '0'); } catch { /* session only */ }
  });
}

/* ------------------------------------------------------------------ theme */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('theme-toggle');
  btn.replaceChildren(iconEl(t === 'dark' ? 'sun' : 'moon', 16));
  btn.setAttribute('aria-label', 'Switch to ' + (t === 'dark' ? 'light' : 'dark') + ' theme');
  btn.title = 'Switch to ' + (t === 'dark' ? 'light' : 'dark') + ' theme';
  btn.setAttribute('data-icon', '');
}
function buildTheme() {
  let t = 'light';
  try {
    const saved = window.localStorage.getItem('rc-theme');
    if (saved === 'dark' || saved === 'light') t = saved;
  } catch { /* storage unavailable: keep light */ }
  applyTheme(t);
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { window.localStorage.setItem('rc-theme', next); } catch { /* keep session-only */ }
  });
}

/* ------------------------------------------------------------------ boot */
async function boot() {
  try { overview = await (await fetch('/api/overview')).json(); } catch { overview = null; }
  try { config = { ...config, ...(await (await fetch('/api/config')).json()) }; } catch { /* defaults kept */ }
  try {
    const r = await fetch('/api/assurance/dashboard');
    if (r.ok) dash = await r.json();
  } catch { dash = null; }
  try {
    const r = await fetch('/api/assurance/counts');
    if (r.ok) counts = await r.json();
  } catch { counts = null; }
  try {
    const r = await fetch('/api/assurance/findings');
    if (r.ok) findings = await r.json();
  } catch { findings = null; }
  try {
    const r = await fetch('/api/trends');
    if (r.ok) trends = await r.json();
  } catch { trends = null; }
  const tenant = overview && overview.tenants ? overview.tenants[0] : { label: 'default' };
  const h = new Date().getHours();
  const word = h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening';
  document.getElementById('page-sub').textContent =
    'Good ' + word + ' · tenant ' + tenant.label + ' · agent suite alpha';
  buildSidebar();
  buildLegend();
  buildTopbar();
  buildCollapse();
  buildTheme();
  paintIcons(document);
  const hash = location.hash.replace('#', '').replace(/^\//, '');
  go(hash);
  window.addEventListener('hashchange', () => {
    const h = location.hash.replace('#', '').replace(/^\//, '');
    go(h);
  });
}
boot();
