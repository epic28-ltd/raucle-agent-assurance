<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- EPIC P2.C fleet view: per-gate rollup + F2 baseline status on one screen. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAA investigation — fleet rollup</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  nav { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; }
  h2 { margin: .6rem 0 .2rem; }
  .legend { font-size: .85rem; margin-bottom: .6rem; }
  .badge-good { background: #e6f4ea; color: #1a5c2c; }   /* green = proven / clean */
  .badge-warn { background: #fdf3d7; color: #6b4e00; }   /* amber = un-proven */
  .badge-bad  { background: #fde8e8; color: #8a1f1f; }   /* red = action needed */
  .badge-absent { background: #eceff3; color: #45525f; } /* grey = ABSENT / not reported */
</style>
</head>
<body>
<nav>
  <strong>Open Agent Assurance — fleet rollup</strong>
  <a href="/">investigation</a>
</nav>
<p class="legend">
  semantic colours — <span class="badge badge-good">proven / clean</span>
  <span class="badge badge-warn">un-proven</span>
  <span class="badge badge-bad">action needed</span>
  <span class="badge badge-absent">ABSENT / not reported</span>
</p>
<main id="app"></main>

<script type="module">
// SPDX-License-Identifier: Apache-2.0
// Threat model T5 discipline: every dynamic value is set with textContent —
// no innerHTML anywhere, no external fetches (only /api/fleet/rollup), and
// ABSENT is rendered as an explicit state, never blank and never zero.
/* R2 slice 1 hosted login hook (fleet). No build toolchain: one inline
   block, textContent discipline untouched (this block touches no DOM).
   Three jobs, in order:
   1. interpose same-origin fetches so every /api|/coverage|/assurance call
      carries the session bearer once a session exists (sessionStorage only
      - tab-scoped, never localStorage, never a cookie);
   2. capture the IdP redirect (?code=...&state=...) and exchange it at
      POST /api/oidc/callback; a login that fails yields no session and
      the page stays on its shell (fail-closed);
   3. probe /api/session/config (public) and, with OIDC enabled and no
      valid session, send the operator to /api/oidc/login. */
(function () {
  'use strict';
  var _fetch = window.fetch.bind(window);
  var TOKEN_KEY = 'oaa_hosted_session';
  function authHeaders() {
    var t = null;
    try { t = sessionStorage.getItem(TOKEN_KEY); } catch (e) { t = null; }
    return t ? { 'Authorization': 'Bearer ' + t } : {};
  }
  window.oaaAuthHeaders = authHeaders;
  window.fetch = function (input, init) {
    try {
      var url = typeof input === 'string' ? input : ((input && input.url) || '');
      if (url.indexOf('/api/') === 0 || url.indexOf('/coverage/') === 0 ||
          url.indexOf('/assurance/') === 0) {
        init = init || {};
        var headers = new Headers(init.headers || {});
        var auth = authHeaders();
        for (var k in auth) { headers.set(k, auth[k]); }
        init.headers = headers;
      }
    } catch (e) { /* the interposer must never break a fetch */ }
    return _fetch(input, init);
  };
  function qs(name) {
    return new URLSearchParams(window.location.search).get(name);
  }
  var code = qs('code');
  var state = qs('state');
  if (code && state) {
    history.replaceState(null, '', window.location.pathname);
    fetch('/api/oidc/callback', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ code: code, state: state })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.session_token) {
        try { sessionStorage.setItem(TOKEN_KEY, d.session_token); } catch (e) {}
        window.location.reload();
      } else {
        /* no session on doubt: stay on the shell, honest empty state */
      }
    }).catch(function () { /* exchange failed: fail closed, stay here */ });
    return;
  }
  if (qs('error')) { history.replaceState(null, '', window.location.pathname); }
  fetch('/api/session/config').then(function (r) { return r.json(); }).then(function (cfg) {
    if (!cfg || !cfg.oidc_enabled) { return; }
    return fetch('/api/session/me', { headers: authHeaders() }).then(function (me) {
      if (me.status === 403) { window.location.href = '/api/oidc/login'; }
    });
  }).catch(function () { /* config probe failed: leave the page as-is */ });
})();

"use strict";
const app = document.getElementById("app");

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = String(text); // hostile text: safe by construction
  return n;
}
function badgeClass(text) {
  if (text === "ABSENT") return "badge badge-absent";
  if (text === "clean" || text === 0) return "badge badge-good";
  if (typeof text === "number" && text > 0) return "badge badge-bad";
  return "badge badge-warn";
}
function badge(parent, text) {
  parent.appendChild(el("span", badgeClass(text), text));
  return parent;
}
function table(head) {
  const t = el("table"); const tr = el("tr");
  head.forEach(h => tr.appendChild(el("th", null, h)));
  t.appendChild(tr); return t;
}

function render(data) {
  app.textContent = "";
  const rollup = data.rollup || {};
  app.appendChild(el("h2", null, "Fleet rollup (per gate)"));
  const t = table(["gate", "findings", "violations", "drift", "unverified", "coverage (as reported)", "F2 baseline", "drill-down"]);
  (rollup.gates || []).forEach(g => {
    const tr = el("tr");
    const name = el("td"); const link = el("a", null, g.gate_id);
    link.href = g.drilldown_url || "/view/runs";
    name.appendChild(link); tr.appendChild(name);
    ["findings_total", "violations", "drift", "unverified", "coverage"].forEach(k => {
      const c = el("td"); badge(c, g[k]); tr.appendChild(c);
    });
    const b = el("td"); badge(b, g.baseline); tr.appendChild(b);
    tr.appendChild(el("td"));
    t.appendChild(tr);
  });
  app.appendChild(t);

  const totals = rollup.totals || {};
  const t2 = table(["fleet metric", "reported total", "gates ABSENT"]);
  ["violations", "drift", "unverified", "findings_total", "baseline_violations"].forEach(k => {
    const tr = el("tr");
    const cell = el("td");
    const fold = totals[k] || {};
    badge(cell, fold.reported_total);
    tr.appendChild(el("td", null, k));
    tr.appendChild(cell);
    tr.appendChild(el("td", null, (fold.absent_gates || []).length ? (fold.absent_gates || []).join(", ") : "—"));
    t2.appendChild(tr);
  });
  app.appendChild(el("h2", null, "Fleet totals (fold over reported gates only)"));
  app.appendChild(t2);
  app.appendChild(el("p", null, rollup.coverage_note || ""));

  app.appendChild(el("h2", null, "Fleet baseline status (F2 regressions)"));
  const bl = data.baseline || {};
  const t3 = table(["gate", "baseline status", "regression violations"]);
  (bl.gates || []).forEach(g => {
    const tr = el("tr");
    tr.appendChild(el("td", null, g.gate_id));
    const c = el("td"); badge(c, g.status); tr.appendChild(c);
    const v = el("td");
    const violations = g.violations;
    if (violations === "ABSENT") {
      badge(v, "ABSENT");
    } else {
      v.appendChild(el("pre", null, JSON.stringify(violations, null, 2)));
    }
    tr.appendChild(v);
    t3.appendChild(tr);
  });
  app.appendChild(t3);
  app.appendChild(el("p", null, (bl.regressed_gates || []).length
    ? "regressed gates: " + bl.regressed_gates.join(", ")
    : "no regressed gates reported"));
}

try {
  const r = await fetch("/api/fleet/rollup");
  render(await r.json());
} catch (e) {
  app.textContent = "fleet rollup unavailable: " + e;
}
</script>
</body>
</html>
