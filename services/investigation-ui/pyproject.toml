[build-system]
requires = []
build-backend = "skip"

[project]
name = "oaa-investigation-ui"
version = "0.1.0"
description = "Open Agent Assurance — UI-01 minimal investigation UI (FastAPI, single-page, no build toolchain)."
requires-python = ">=3.11"
license = { file = "../../LICENSE" }
# Pinned locally for the UI-01 spike; minimal on purpose.
dependencies = [
  "fastapi==0.118.3",
  "httpx==0.28.1",  # fastapi TestClient transport + optional Langfuse live source
]
[project.optional-dependencies]
serve = ["uvicorn==0.38.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "PLC"]

[pytest.ini_options]
testpaths = ["tests"]